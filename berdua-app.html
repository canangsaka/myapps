<style>
/* ── THEMES ── */
:root, [data-theme="dark"] {
  --bg:#000000; --surface:#0a0a0a; --surface2:#111111;
  --border:#1a1a1a; --border2:#252525; --soft:#0d0d0d;
  --text:#f0ede8; --text2:#888; --muted:#3a3a3a; --white:#f0ede8;
  --rose:#c85a42; --rose2:#d4694f; --rose-soft:rgba(200,90,66,0.1); --rose-border:rgba(200,90,66,0.22);
  --green:#4a9e70; --green-soft:rgba(74,158,112,0.1); --green-border:rgba(74,158,112,0.2);
  --card-bg:#0a0a0a; --input-bg:#0d0d0d;
  --shadow:0 2px 16px rgba(0,0,0,0.5);
  --p1:#dc2626; --p1bg:#1a0a0a; --p2:#ea580c; --p2bg:#1a0e06;
  --p3:#ca8a04; --p3bg:#1a1500; --p4:#6b7280; --p4bg:#111111;
}
[data-theme="light"] {
  --bg:#f7f4f0; --surface:#ffffff; --surface2:#f0ede8;
  --border:#e5e0da; --border2:#d8d0c8; --soft:#f7f4f0;
  --text:#1a1410; --text2:#7a6e66; --muted:#b0a89e; --white:#ffffff;
  --rose:#c85a42; --rose2:#b84e38; --rose-soft:rgba(200,90,66,0.08); --rose-border:rgba(200,90,66,0.2);
  --green:#2d7a50; --green-soft:rgba(45,122,80,0.08); --green-border:rgba(45,122,80,0.18);
  --card-bg:#ffffff; --input-bg:#f7f4f0;
  --shadow:0 2px 12px rgba(0,0,0,0.08);
  --p1:#dc2626; --p1bg:#fff0f0; --p2:#ea580c; --p2bg:#fff5f0;
  --p3:#b45309; --p3bg:#fffbf0; --p4:#6b7280; --p4bg:#f5f5f5;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:84px;-webkit-font-smoothing:antialiased;transition:background 0.3s,color 0.3s;}

/* NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:200;transition:background 0.3s,border-color 0.3s;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 14px;gap:3px;background:none;border:none;cursor:pointer;transition:all 0.15s;}
.nav-icon{font-size:19px;transition:transform 0.2s;}
.nav-label{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;}
.nav-btn.active .nav-label{color:var(--rose);}
.nav-btn.active .nav-icon{transform:scale(1.18);}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px 11px;position:sticky;top:0;z-index:100;transition:background 0.3s,border-color 0.3s;}
.header-row{display:flex;justify-content:space-between;align-items:center;}
.header h1{font-family:'Fraunces',serif;font-size:21px;font-weight:700;color:var(--text);letter-spacing:-0.02em;}
.header-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.header-right{display:flex;align-items:center;gap:8px;}

/* THEME TOGGLE */
.theme-toggle{background:none;border:1px solid var(--border2);border-radius:99px;padding:5px 10px;cursor:pointer;font-size:14px;transition:all 0.2s;color:var(--text2);display:flex;align-items:center;gap:4px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;}
.theme-toggle:active{transform:scale(0.94);}

/* SYNC */
.sync-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted);background:var(--surface2);border-radius:99px;padding:4px 10px;border:1px solid var(--border);}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;}
.sync-dot.offline{background:#f59e0b;}

/* PROFILE */
.profile-btn{background:none;border:none;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;font-weight:700;color:var(--text2);display:flex;align-items:center;gap:4px;padding:2px 0;}

/* PAGES */
.page{display:none;animation:fadeUp 0.22s ease;}
.page.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.main{max-width:600px;margin:0 auto;padding:0 13px;}

/* CARDS */
.card{background:var(--card-bg);border-radius:14px;border:1px solid var(--border);transition:background 0.3s,border-color 0.3s;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:700;font-size:14px;transition:all 0.15s;padding:10px 18px;}
.btn-dark{background:var(--text);color:var(--bg);}
.btn-dark:active{transform:scale(0.97);}
.btn-rose{background:var(--rose);color:#fff;}
.btn-rose:active{transform:scale(0.97);}
.btn-ghost{background:transparent;border:1.5px solid var(--border2);color:var(--text2);font-size:13px;padding:8px 14px;font-weight:600;}
.btn-ghost:active{background:var(--surface2);}

/* FAB */
.fab{position:fixed;bottom:72px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--rose);color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 20px var(--rose-soft);z-index:150;display:flex;align-items:center;justify-content:center;transition:all 0.18s;font-weight:700;line-height:1;}
.fab:active{transform:scale(0.91);}

/* FORM SHEET */
.form-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:300;align-items:flex-end;}
.form-overlay.open{display:flex;animation:fadeIn 0.18s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.form-sheet{background:var(--surface);border-radius:22px 22px 0 0;padding:20px 16px 40px;width:100%;max-height:92vh;overflow-y:auto;animation:slideUp 0.25s ease;border-top:1px solid var(--border2);transition:background 0.3s;}
@keyframes slideUp{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.form-handle{width:36px;height:4px;background:var(--border2);border-radius:99px;margin:0 auto 18px;}
.form-title{font-family:'Fraunces',serif;font-size:19px;font-weight:700;margin-bottom:17px;color:var(--text);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.fg{display:flex;flex-direction:column;gap:5px;}
.fg.full{grid-column:1/-1;}
.fg label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.07em;}
.fg input,.fg select,.fg textarea{font-family:'DM Sans',sans-serif;border:1.5px solid var(--border2);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--input-bg);outline:none;width:100%;transition:border 0.15s,background 0.3s;color:var(--text);-webkit-appearance:none;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--rose);}
.fg select option{background:var(--surface);}
.form-actions{display:flex;gap:8px;margin-top:16px;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:400;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;animation:fadeIn 0.18s;}
.modal-box{background:var(--surface);border:1px solid var(--border2);border-radius:18px;padding:22px 18px;width:100%;max-width:340px;max-height:88vh;overflow-y:auto;}
.modal-box h3{font-family:'Fraunces',serif;font-size:17px;font-weight:700;margin-bottom:6px;}
.modal-box p{font-size:13px;color:var(--text2);margin-bottom:16px;line-height:1.55;}

/* SETUP */
.setup-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;}
.setup-screen h1{font-family:'Fraunces',serif;font-size:28px;font-weight:800;margin-bottom:8px;}
.setup-screen p{color:var(--text2);font-size:13px;margin-bottom:28px;line-height:1.6;max-width:280px;}
.setup-emoji{font-size:52px;margin-bottom:20px;}
.setup-input{max-width:260px;width:100%;padding:12px 16px;font-family:'DM Sans',sans-serif;font-size:16px;border:1.5px solid var(--border2);border-radius:12px;background:var(--surface);outline:none;text-align:center;color:var(--text);-webkit-appearance:none;}
.setup-input:focus{border-color:var(--rose);}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:11px;}
.search-wrap::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none;}
.search-wrap input{width:100%;padding:9px 12px 9px 33px;border:1.5px solid var(--border);border-radius:11px;font-family:'DM Sans',sans-serif;font-size:14px;background:var(--surface);outline:none;color:var(--text);-webkit-appearance:none;transition:border 0.15s,background 0.3s;}
.search-wrap input:focus{border-color:var(--rose);}

/* SORT ROW */
.sort-row{display:flex;gap:7px;align-items:center;margin-bottom:11px;}
.sort-row select{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;border:1.5px solid var(--border);border-radius:8px;padding:5px 10px;background:var(--surface);color:var(--text2);outline:none;-webkit-appearance:none;}
.filter-chips{display:flex;gap:5px;flex-wrap:wrap;}
.chip{font-size:11px;font-weight:700;padding:5px 11px;border-radius:99px;border:1.5px solid var(--border2);background:none;cursor:pointer;color:var(--text2);font-family:'DM Sans',sans-serif;transition:all 0.15s;}
.chip.active{border-color:var(--rose);color:var(--rose);background:var(--rose-soft);}

/* NEEDS CARDS */
.needs-list{display:flex;flex-direction:column;gap:9px;}
.need-card{background:var(--card-bg);border-radius:14px;border-left:3px solid;border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:13px 14px;transition:background 0.3s;}
.need-card.p1{border-left-color:var(--p1);}
.need-card.p2{border-left-color:var(--p2);}
.need-card.p3{border-left-color:var(--p3);}
.need-card.p4{border-left-color:var(--p4);}
.need-top{display:flex;align-items:flex-start;gap:10px;}
.need-body{flex:1;min-width:0;}
.need-name{font-weight:700;font-size:15px;margin-bottom:2px;}
.need-cat{font-size:11px;color:var(--text2);margin-bottom:6px;}
.need-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--text2);}
.need-meta span{display:inline-flex;align-items:center;gap:3px;}
.pri-badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:0.04em;flex-shrink:0;}
.pri-badge.p1{background:var(--p1bg);color:var(--p1);}
.pri-badge.p2{background:var(--p2bg);color:var(--p2);}
.pri-badge.p3{background:var(--p3bg);color:var(--p3);}
.pri-badge.p4{background:var(--p4bg);color:var(--p4);}
.need-actions{display:flex;align-items:center;gap:3px;flex-shrink:0;}
.status-btn{font-size:12px;padding:5px 9px;border-radius:8px;border:1.5px solid var(--border2);background:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:700;transition:all 0.15s;color:var(--text2);}
.status-btn.done{border-color:var(--green);color:var(--green);background:var(--green-soft);}
.need-note{font-size:12px;color:var(--text2);margin-top:7px;padding-top:7px;border-top:1px solid var(--border);font-style:italic;}

/* SUMMARY ROW */
.s-row{display:flex;gap:8px;margin:0 0 13px;}
.s-card{flex:1;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;transition:background 0.3s;}
.s-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:3px;}
.s-val{font-family:'Fraunces',serif;font-size:16px;font-weight:700;}

/* EXPENSE */
.balance-card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:16px;margin:13px 0;transition:background 0.3s;}
.bc-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);}
.bc-amount{font-family:'Fraunces',serif;font-size:30px;font-weight:800;margin:4px 0 2px;}
.bc-sub{font-size:12px;color:var(--text2);}
.split-row{display:flex;gap:8px;margin:11px 0;}
.split-card{flex:1;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:11px 12px;transition:background 0.3s;}
.split-name{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px;}
.split-amount{font-family:'Fraunces',serif;font-size:18px;font-weight:700;}
.exp-list{display:flex;flex-direction:column;gap:7px;}
.exp-item{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:11px 13px;display:flex;align-items:center;gap:10px;transition:background 0.3s;}
.exp-icon{font-size:20px;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.exp-body{flex:1;min-width:0;}
.exp-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exp-meta{font-size:11px;color:var(--text2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;}
.exp-rp{font-weight:700;font-size:14px;font-family:'Fraunces',serif;flex-shrink:0;}
.exp-rp.you{color:var(--rose);}
.exp-rp.partner{color:var(--green);}
.exp-rp.bersama{color:var(--text);}
.exp-actions{display:flex;gap:2px;margin-top:3px;justify-content:flex-end;}
.act-btn{background:none;border:none;cursor:pointer;font-size:14px;padding:3px 5px;border-radius:6px;transition:background 0.12s;}
.act-btn:active{background:var(--border2);}

/* SAVINGS */
.saving-card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:9px;transition:background 0.3s;}
.saving-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.saving-name{font-family:'Fraunces',serif;font-weight:700;font-size:16px;}
.saving-deadline{font-size:11px;color:var(--text2);margin-top:3px;}
.saving-pct{font-family:'Fraunces',serif;font-size:22px;font-weight:800;}
.saving-progress{height:6px;background:var(--border2);border-radius:99px;overflow:hidden;margin:8px 0;}
.saving-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--rose),#e8855e);transition:width 0.6s ease;}
.saving-fill.done{background:linear-gradient(90deg,var(--green),#6ddfaa);}
.saving-amounts{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);}
.saving-amounts strong{color:var(--text);font-size:13px;font-family:'Fraunces',serif;font-weight:700;}
.saving-actions{display:flex;gap:6px;margin-top:12px;}
.btn-topup{flex:1;background:var(--rose-soft);color:var(--rose);border:1px solid var(--rose-border);border-radius:9px;padding:8px 14px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:all 0.15s;}
.btn-topup:active{transform:scale(0.97);}

/* SEC HEADER */
.sec-header{display:flex;justify-content:space-between;align-items:center;padding:14px 0 9px;}
.sec-title{font-family:'Fraunces',serif;font-size:15px;font-weight:700;}

/* DATE GROUP */
.date-group-header{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;padding:10px 2px 5px;}

/* TABS */
.tabs{display:flex;gap:3px;background:var(--surface2);border-radius:10px;padding:4px;margin-bottom:13px;border:1px solid var(--border);}
.tab{flex:1;text-align:center;padding:7px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;color:var(--muted);border:none;background:none;font-family:'DM Sans',sans-serif;transition:all 0.15s;letter-spacing:0.02em;}
.tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.15);}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-icon{font-size:36px;margin-bottom:10px;}
.empty-txt{font-size:13px;line-height:1.6;}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;transition:all 0.28s;pointer-events:none;z-index:500;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.3);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* RENAME MODAL */
.rename-input{width:100%;padding:11px 13px;font-family:'DM Sans',sans-serif;font-size:15px;border:1.5px solid var(--border2);border-radius:10px;background:var(--input-bg);color:var(--text);outline:none;-webkit-appearance:none;margin-bottom:14px;}
.rename-input:focus{border-color:var(--rose);}
</style>
</head>
<body>

<!-- SETUP -->
<div class="setup-screen" id="setupScreen">
  <div class="setup-emoji">💕</div>
  <h1>Berdua</h1>
  <p>App keuangan dan rencana bareng. Mulai dengan nama kamu.</p>
  <input class="setup-input" id="setupInput" type="text" placeholder="Nama kamu..." maxlength="20" onkeydown="if(event.key==='Enter')saveName()">
  <div style="height:14px"></div>
  <button class="btn btn-rose" onclick="saveName()" style="width:160px">Mulai →</button>
</div>

<!-- APP -->
<div id="appRoot" style="display:none">
  <div class="header">
    <div class="header-row">
      <div>
        <h1 id="pageTitle">Needs List</h1>
        <div class="header-sub">
          <button class="profile-btn" id="profileBtn" onclick="openRename()">
            <span id="syncLabel"></span> ✏️
          </button>
        </div>
      </div>
      <div class="header-right">
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">☀️ Light</button>
        <div class="sync-pill"><div class="sync-dot" id="syncDot"></div><span id="syncStatus">Sync</span></div>
      </div>
    </div>
  </div>

  <!-- NEEDS LIST -->
  <div class="page active" id="pageNeeds">
    <div class="main">
      <div style="padding:12px 0 8px">
        <div class="s-row" id="needsSummary"></div>
        <div class="search-wrap"><input type="text" id="searchInput" placeholder="Cari item..." oninput="renderNeeds()"></div>
        <div class="sort-row">
          <select id="sortSelect" onchange="renderNeeds()">
            <option value="priority">Prioritas</option>
            <option value="name">Nama</option>
            <option value="price">Harga</option>
            <option value="newest">Terbaru</option>
          </select>
          <div class="filter-chips" id="filterChips"></div>
        </div>
      </div>
      <div class="needs-list" id="needsList"></div>
      <div style="height:8px"></div>
    </div>
  </div>

  <!-- EXPENSES -->
  <div class="page" id="pageExpenses">
    <div class="main">
      <div class="balance-card" id="balanceCard"></div>
      <div class="split-row" id="splitRow"></div>
      <div class="sec-header">
        <div class="sec-title">Pengeluaran Bulan Ini</div>
      </div>
      <div class="exp-list" id="expList"></div>
      <div style="height:8px"></div>
    </div>
  </div>

  <!-- SAVINGS -->
  <div class="page" id="pageSavings">
    <div class="main">
      <div class="sec-header"><div class="sec-title">Tabungan Berdua 💕</div></div>
      <div id="savingsList"></div>
      <div style="height:8px"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="navNeeds" onclick="switchPage('Needs')"><span class="nav-icon">📋</span><span class="nav-label">List</span></button>
    <button class="nav-btn" id="navExpenses" onclick="switchPage('Expenses')"><span class="nav-icon">💸</span><span class="nav-label">Pengeluaran</span></button>
    <button class="nav-btn" id="navSavings" onclick="switchPage('Savings')"><span class="nav-icon">🐷</span><span class="nav-label">Tabungan</span></button>
  </nav>
  <button class="fab" onclick="openFab()">+</button>
</div>

<!-- FORM: NEED -->
<div class="form-overlay" id="formNeed">
  <div class="form-sheet">
    <div class="form-handle"></div>
    <div class="form-title" id="needFormTitle">Item Baru</div>
    <div class="form-grid">
      <div class="fg full"><label>Nama Item *</label><input type="text" id="nName" placeholder="e.g. Rice cooker, Tiket konser..."></div>
      <div class="fg"><label>Kategori</label>
        <select id="nCat">
          <option>🏠 Rumah</option><option>🍽️ Dapur</option><option>👔 Fashion</option>
          <option>💻 Elektronik</option><option>✈️ Liburan</option><option>🎮 Hiburan</option>
          <option>🏥 Kesehatan</option><option>📚 Pendidikan</option><option>🎯 Lainnya</option>
        </select>
      </div>
      <div class="fg"><label>Prioritas</label>
        <select id="nPriority">
          <option value="1">🔴 P1 — Harus</option>
          <option value="2">🟠 P2 — Perlu</option>
          <option value="3" selected>🟡 P3 — Mau</option>
          <option value="4">⚪ P4 — Nanti</option>
        </select>
      </div>
      <div class="fg"><label>Est. Harga (Rp)</label><input type="number" id="nPrice" placeholder="0"></div>
      <div class="fg"><label>Deadline</label><input type="date" id="nDeadline"></div>
      <div class="fg"><label>Toko / Sumber</label><input type="text" id="nStore" placeholder="Tokopedia, Shopee..."></div>
      <div class="fg full"><label>Catatan</label><input type="text" id="nNote" placeholder="Opsional..."></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-rose" onclick="submitNeed()">Simpan</button>
      <button class="btn btn-ghost" onclick="closeForm('formNeed')">Batal</button>
    </div>
  </div>
</div>

<!-- FORM: EXPENSE -->
<div class="form-overlay" id="formExp">
  <div class="form-sheet">
    <div class="form-handle"></div>
    <div class="form-title" id="expFormTitle">Catat Pengeluaran</div>
    <div class="form-grid">
      <div class="fg full"><label>Keterangan *</label><input type="text" id="eDesc" placeholder="e.g. Makan malam, Belanja..."></div>
      <div class="fg"><label>Jumlah (Rp) *</label><input type="number" id="eAmount" placeholder="0"></div>
      <div class="fg"><label>Tanggal</label><input type="date" id="eDate"></div>
      <div class="fg"><label>Dibayar oleh</label>
        <select id="eBy">
          <option value="you">Kamu</option>
          <option value="partner">Pasangan</option>
          <option value="bersama">💕 Bersama</option>
        </select>
      </div>
      <div class="fg"><label>Kategori</label>
        <select id="eCat">
          <option>🍽️ Makan</option><option>🚗 Transport</option><option>🏠 Rumah</option>
          <option>🛒 Belanja</option><option>🎮 Hiburan</option><option>🏥 Kesehatan</option>
          <option>💡 Tagihan</option><option>🎯 Lainnya</option>
        </select>
      </div>
      <div class="fg full"><label>Catatan</label><input type="text" id="eNote" placeholder="Opsional..."></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-rose" onclick="submitExp()">Simpan</button>
      <button class="btn btn-ghost" onclick="closeForm('formExp')">Batal</button>
    </div>
  </div>
</div>

<!-- FORM: SAVING -->
<div class="form-overlay" id="formSaving">
  <div class="form-sheet">
    <div class="form-handle"></div>
    <div class="form-title" id="savingFormTitle">Target Tabungan</div>
    <div class="form-grid">
      <div class="fg full"><label>Nama Target *</label><input type="text" id="sName" placeholder="e.g. Liburan Bali, Kamera..."></div>
      <div class="fg"><label>Emoji</label><input type="text" id="sEmoji" placeholder="🎯" maxlength="2"></div>
      <div class="fg"><label>Target (Rp) *</label><input type="number" id="sTarget" placeholder="0"></div>
      <div class="fg full"><label>Deadline</label><input type="date" id="sDeadline"></div>
      <div class="fg full"><label>Catatan</label><input type="text" id="sNote" placeholder="Opsional..."></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-rose" onclick="submitSaving()">Simpan</button>
      <button class="btn btn-ghost" onclick="closeForm('formSaving')">Batal</button>
    </div>
  </div>
</div>

<!-- FORM: TOPUP -->
<div class="form-overlay" id="formTopup">
  <div class="form-sheet">
    <div class="form-handle"></div>
    <div class="form-title">Tambah Tabungan</div>
    <input type="hidden" id="topupId">
    <div class="form-grid">
      <div class="fg"><label>Jumlah (Rp) *</label><input type="number" id="topupAmount" placeholder="0"></div>
      <div class="fg"><label>Dari siapa</label>
        <select id="topupBy">
          <option value="you">Kamu</option>
          <option value="partner">Pasangan</option>
        </select>
      </div>
      <div class="fg full"><label>Catatan</label><input type="text" id="topupNote" placeholder="Opsional..."></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-rose" onclick="submitTopup()">Tabung</button>
      <button class="btn btn-ghost" onclick="closeForm('formTopup')">Batal</button>
    </div>
  </div>
</div>

<!-- MODAL: RENAME -->
<div class="modal-overlay" id="modalRename">
  <div class="modal-box">
    <h3>✏️ Ganti Nama</h3>
    <p>Nama lama akan tetap tercatat di histori, tapi kontribusi tabungan akan dipindah ke nama baru.</p>
    <input class="rename-input" id="renameInput" type="text" maxlength="20" placeholder="Nama baru..." onkeydown="if(event.key==='Enter')submitRename()">
    <div class="form-actions">
      <button class="btn btn-rose" onclick="submitRename()">Simpan</button>
      <button class="btn btn-ghost" onclick="document.getElementById('modalRename').classList.remove('open')">Batal</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, push, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8uS9-jG_2QLHnXKjbSQ700EXpVzKoias",
  authDomain: "berdua-yayasaka.firebaseapp.com",
  databaseURL: "https://berdua-yayasaka-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "berdua-yayasaka",
  storageBucket: "berdua-yayasaka.firebasestorage.app",
  messagingSenderId: "415236319494",
  appId: "1:415236319494:web:0852fd921e85a7c1aa5687",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ── GLOBALS ──
const CATS_NEEDS = ["🛒 Belanja","🏥 Kesehatan","💡 Tagihan","🏠 Rumah","👔 Pakaian","📚 Pendidikan","🍽️ Makanan","🚗 Transportasi","💼 Kerja","🎯 Lainnya"];
const CATS_EXP = ["🍽️ Makan & Minum","🛒 Belanja","🚗 Transportasi","🏠 Rumah","🏥 Kesehatan","💡 Tagihan","🎮 Hiburan","👔 Fashion","📚 Pendidikan","💼 Kerja","🎯 Lainnya"];
const PRIO = [
  {level:1,label:"Must Have",color:"#dc2626",bg:"#fef2f2"},
  {level:2,label:"Should Have",color:"#ea580c",bg:"#fff7ed"},
  {level:3,label:"Nice to Have",color:"#ca8a04",bg:"#fefce8"},
  {level:4,label:"Can Wait",color:"#6b7280",bg:"#f9fafb"},
];
const STATUS = ["⬜ Belum","🔄 Proses","✅ Selesai"];

let userName = localStorage.getItem("berdua_name") || "";
let partnerName = "Pasangan";
let currentPage = "Needs";
let needs = {};
let expenses = {};
let savings = {};
let filterPrio = 0;
let filterStatus = "Semua";
let editNeedId = null;
let editExpId = null;
let editSavingId = null;
let selectedMonth = "";

const today = new Date().toISOString().split("T")[0];
selectedMonth = today.slice(0,7);

// ── SETUP ──
function populate() {
  // needs categories
  const fc = document.getElementById("fKat");
  fc.innerHTML = ""; CATS_NEEDS.forEach(c=>{ const o=document.createElement("option");o.value=c;o.textContent=c;fc.appendChild(o); });
  // expense categories
  const ec = document.getElementById("eCat");
  ec.innerHTML = ""; CATS_EXP.forEach(c=>{ const o=document.createElement("option");o.value=c;o.textContent=c;ec.appendChild(o); });
}
populate();

// ── FIREBASE LISTENERS ──
function startListeners() {
  onValue(ref(db,"needs"), snap => {
    needs = snap.val() || {};
    if(currentPage==="Needs") renderNeeds();
    syncIndicator(true);
  });
  onValue(ref(db,"expenses"), snap => {
    expenses = snap.val() || {};
    if(currentPage==="Expenses") renderExpenses();
    syncIndicator(true);
  });
  onValue(ref(db,"savings"), snap => {
    savings = snap.val() || {};
    if(currentPage==="Savings") renderSavings();
    syncIndicator(true);
  });
  onValue(ref(db,"meta"), snap => {
    const m = snap.val() || {};
    if(m.names) {
      const others = Object.values(m.names).filter(n=>n!==userName);
      if(others.length) partnerName = others[0];
    }
    // register own name
    set(ref(db,"meta/names/"+encodeURIComponent(userName)), userName);
  });
}

function syncIndicator(ok) {
  document.getElementById("syncDot").className = "sync-dot" + (ok?"" :" offline");
}

// ── NAME ──
window.saveName = function() {
  const v = document.getElementById("setupInput").value.trim();
  if(!v) return;
  userName = v;
  localStorage.setItem("berdua_name", v);
  document.getElementById("setupScreen").style.display = "none";
  document.getElementById("appRoot").style.display = "block";
  document.getElementById("syncLabel").textContent = userName;
  set(ref(db,"meta/names/"+encodeURIComponent(userName)), userName);
  startListeners();
  switchPage("Needs");
  showToast("Halo "+userName+" 👋");
};

// ── PAGE SWITCH ──
window.switchPage = function(page) {
  currentPage = page;
  ["Needs","Expenses","Savings"].forEach(p => {
    document.getElementById("page"+p).classList.toggle("active", p===page);
    document.getElementById("nav"+p).classList.toggle("active", p===page);
  });
  const titles = {Needs:"List Kebutuhan",Expenses:"Catatan Keuangan",Savings:"Tabungan Bersama"};
  document.getElementById("pageTitle").textContent = titles[page];
  document.getElementById("headerProgress").style.display = page==="Needs" ? "block" : "none";
  if(page==="Needs") { renderNeeds(); }
  if(page==="Expenses") { populateMonthSel(); renderExpenses(); }
  if(page==="Savings") renderSavings();
};

window.openFab = function() {
  if(currentPage==="Needs") { editNeedId=null; openNeedForm(); }
  else if(currentPage==="Expenses") { editExpId=null; openExpForm(); }
  else if(currentPage==="Savings") { editSavingId=null; openSavingForm(); }
};

// ── FORM UTILS ──
window.closeForm = function(id) {
  document.getElementById(id).classList.remove("open");
};
function openForm(id) {
  document.getElementById(id).classList.add("open");
  // close on backdrop tap
  document.getElementById(id).onclick = function(e) {
    if(e.target===this) closeForm(id);
  };
}

// ─────────────────────────────────────────────
// ── NEEDS ──
// ─────────────────────────────────────────────
function openNeedForm(item) {
  document.getElementById("needsFormTitle").textContent = item ? "Edit Item" : "Item Baru";
  if(item) {
    document.getElementById("fNama").value = item.nama||"";
    document.getElementById("fKat").value = item.kategori||CATS_NEEDS[0];
    document.getElementById("fPrio").value = item.prioritas||1;
    document.getElementById("fQty").value = item.qty||1;
    document.getElementById("fSatuan").value = item.satuan||"";
    document.getElementById("fHarga").value = item.harga||"";
    document.getElementById("fDeadline").value = item.deadline||"";
    document.getElementById("fToko").value = item.toko||"";
    document.getElementById("fNotes").value = item.notes||"";
  } else {
    ["fNama","fSatuan","fHarga","fDeadline","fToko","fNotes"].forEach(id=>document.getElementById(id).value="");
    document.getElementById("fQty").value=1;
    document.getElementById("fPrio").value=1;
    document.getElementById("fKat").value=CATS_NEEDS[0];
  }
  openForm("formNeeds");
  setTimeout(()=>document.getElementById("fNama").focus(),100);
}

window.submitNeed = function() {
  const nama = document.getElementById("fNama").value.trim();
  if(!nama) { showToast("Nama tidak boleh kosong!"); return; }
  const data = {
    nama,
    kategori: document.getElementById("fKat").value,
    prioritas: Number(document.getElementById("fPrio").value),
    qty: Number(document.getElementById("fQty").value)||1,
    satuan: document.getElementById("fSatuan").value.trim(),
    harga: Number(document.getElementById("fHarga").value)||0,
    deadline: document.getElementById("fDeadline").value,
    toko: document.getElementById("fToko").value.trim(),
    notes: document.getElementById("fNotes").value.trim(),
    status: "⬜ Belum",
    addedBy: userName,
    ts: Date.now(),
  };
  if(editNeedId) {
    update(ref(db,"needs/"+editNeedId), data);
    showToast("Item diperbarui ✓");
  } else {
    push(ref(db,"needs"), data);
    showToast("Item ditambah ✓");
  }
  closeForm("formNeeds");
};

window.cycleStatus = function(id) {
  const item = needs[id]; if(!item) return;
  const idx = STATUS.indexOf(item.status);
  update(ref(db,"needs/"+id), {status: STATUS[(idx+1)%STATUS.length]});
};

window.editNeed = function(id) {
  editNeedId = id;
  openNeedForm(needs[id]);
};

window.deleteNeed = function(id) {
  if(!confirm("Hapus item ini?")) return;
  remove(ref(db,"needs/"+id));
  showToast("Item dihapus");
};

function renderNeeds() {
  const arr = Object.entries(needs).map(([id,v])=>({id,...v}));
  const search = document.getElementById("needsSearch").value.toLowerCase();
  const sort = document.getElementById("needsSort").value;

  let filtered = [...arr];
  if(filterPrio) filtered=filtered.filter(i=>i.prioritas==filterPrio);
  if(filterStatus!=="Semua") filtered=filtered.filter(i=>i.status===filterStatus);
  if(search) filtered=filtered.filter(i=>(i.nama||"").toLowerCase().includes(search)||(i.kategori||"").toLowerCase().includes(search));
  filtered.sort((a,b)=>{
    if(sort==="prioritas") return (a.prioritas||4)-(b.prioritas||4);
    if(sort==="deadline") return (a.deadline||"9999")>(b.deadline||"9999")?1:-1;
    if(sort==="harga") return (b.harga*b.qty)-(a.harga*a.qty);
    return (b.ts||0)-(a.ts||0);
  });

  // priority grid
  const pg = document.getElementById("pGrid"); pg.innerHTML="";
  PRIO.forEach(p=>{
    const cnt = arr.filter(i=>i.prioritas==p.level).length;
    const div=document.createElement("div");
    div.className="p-card"+(filterPrio===p.level?" active":"");
    div.style.cssText=`background:${p.bg};opacity:${filterPrio&&filterPrio!==p.level?0.45:1}`;
    if(filterPrio===p.level) div.style.borderColor=p.color;
    div.innerHTML=`<div class="p-card-top"><div class="p-dot" style="background:${p.color}"></div><span class="p-lbl" style="color:${p.color}">P${p.level}</span></div><div class="p-name">${p.label}</div><div class="p-count" style="color:${p.color}">${cnt} item</div>`;
    div.onclick=()=>{filterPrio=filterPrio===p.level?0:p.level;renderNeeds();};
    pg.appendChild(div);
  });

  // filter chips
  const fr=document.getElementById("filterRow"); fr.innerHTML="";
  ["Semua",...STATUS].forEach(s=>{
    const sp=document.createElement("span");
    sp.className="chip"+(filterStatus===s?" active":"");
    sp.textContent=s;
    sp.onclick=()=>{filterStatus=s;renderNeeds();};
    fr.appendChild(sp);
  });

  // items
  const list=document.getElementById("needsList"); list.innerHTML="";
  if(!filtered.length) {
    list.innerHTML=`<div class="empty"><div class="empty-icon">📋</div><div class="empty-txt">Belum ada item. Tap + untuk nambah!</div></div>`;
  } else {
    filtered.forEach(item=>{
      const p=PRIO.find(x=>x.level==item.prioritas)||PRIO[3];
      const done=item.status==="✅ Selesai";
      const overdue=item.deadline&&item.deadline<today&&!done;
      const div=document.createElement("div");
      div.className="item-card"+(done?" done":"");
      div.innerHTML=`<div class="item-top">
        <div class="item-dot" style="background:${p.color};margin-top:5px"></div>
        <div class="item-body">
          <div class="item-name${done?" striked":""}">${item.nama||""}</div>
          <div class="item-tags">
            <span class="tag" style="background:${p.bg};color:${p.color}">P${p.level} ${p.label}</span>
            <span style="font-size:11px;color:#bbb">${item.kategori||""}</span>
          </div>
          <div class="item-meta">
            <span>${item.qty||1} ${item.satuan||""}${item.harga?" · "+rp(item.harga*(item.qty||1)):""}</span>
            ${item.deadline?`<span class="${overdue?"overdue":""}">${overdue?"⚠️ ":"📅 "}${fmtDate(item.deadline)}</span>`:""}
            ${item.toko?`<span>📍 ${item.toko}</span>`:""}
          </div>
          ${item.notes?`<div class="item-note">"${item.notes}"</div>`:""}
          ${item.addedBy?`<div class="added-by">oleh ${item.addedBy}</div>`:""}
        </div>
        <div class="item-actions">
          <button class="act-btn" onclick="cycleStatus('${item.id}')">${item.status==="✅ Selesai"?"✅":item.status==="🔄 Proses"?"🔄":"⬜"}</button>
          <button class="act-btn" onclick="editNeed('${item.id}')">✏️</button>
          <button class="act-btn" onclick="deleteNeed('${item.id}')">🗑️</button>
        </div>
      </div>`;
      list.appendChild(div);
    });
  }

  // header update
  const done=arr.filter(i=>i.status==="✅ Selesai").length;
  const total=arr.length;
  document.getElementById("progressFill").style.width=(total?(done/total*100):0)+"%";
  const totalEst=arr.reduce((s,i)=>s+(Number(i.harga)*Number(i.qty||1)||0),0);
  document.getElementById("pageSub").textContent=`${done}/${total} selesai · Est. ${rp(totalEst)}`;

  // summary
  const sc=document.getElementById("needsSummary");
  const sr=document.getElementById("summaryRow");
  if(arr.length) {
    sc.style.display="block";
    sr.innerHTML=PRIO.map(p=>{
      const t=arr.filter(i=>i.prioritas==p.level).reduce((s,i)=>s+(Number(i.harga)*(Number(i.qty)||1)||0),0);
      return t?`<div class="s-item"><div class="s-label" style="color:${p.color}">P${p.level}</div><div class="s-val">${rp(t)}</div></div>`:"";
    }).join("")+`<div class="s-item s-total"><div class="s-label" style="color:var(--muted)">Total</div><div class="s-val" style="font-family:'Fraunces',serif;font-size:16px">${rp(totalEst)}</div></div>`;
  } else { sc.style.display="none"; }
}

// ─────────────────────────────────────────────
// ── EXPENSES ──
// ─────────────────────────────────────────────
function openExpForm(item) {
  document.getElementById("expFormTitle").textContent = item?"Edit Pengeluaran":"Catat Pengeluaran";
  if(item) {
    document.getElementById("eDesc").value=item.desc||"";
    document.getElementById("eAmount").value=item.amount||"";
    document.getElementById("eCat").value=item.cat||CATS_EXP[0];
    document.getElementById("ePaidBy").value=item.paidBy||"you";
    document.getElementById("eType").value=item.type||"bersama";
    document.getElementById("eDate").value=item.date||today;
    document.getElementById("eNote").value=item.note||"";
  } else {
    document.getElementById("eDesc").value="";
    document.getElementById("eAmount").value="";
    document.getElementById("eDate").value=today;
    document.getElementById("eNote").value="";
    document.getElementById("ePaidBy").value="you";
    document.getElementById("eType").value="bersama";
    document.getElementById("eCat").value=CATS_EXP[0];
  }
  openForm("formExpense");
  setTimeout(()=>document.getElementById("eDesc").focus(),100);
}

window.submitExpense = function() {
  const desc=document.getElementById("eDesc").value.trim();
  const amount=Number(document.getElementById("eAmount").value);
  if(!desc||!amount) { showToast("Isi keterangan & jumlah!"); return; }
  const data={
    desc, amount,
    cat: document.getElementById("eCat").value,
    paidBy: document.getElementById("ePaidBy").value,
    type: document.getElementById("eType").value,
    date: document.getElementById("eDate").value||today,
    note: document.getElementById("eNote").value.trim(),
    addedBy: userName,
    ts: Date.now(),
  };
  if(editExpId) {
    update(ref(db,"expenses/"+editExpId), data);
    showToast("Diperbarui ✓");
  } else {
    push(ref(db,"expenses"), data);
    showToast("Dicatat ✓");
  }
  closeForm("formExpense");
};

window.editExp = function(id) {
  editExpId=id;
  openExpForm(expenses[id]);
};

window.deleteExp = function(id) {
  if(!confirm("Hapus transaksi ini?")) return;
  remove(ref(db,"expenses/"+id));
  showToast("Dihapus");
};

function populateMonthSel() {
  const sel=document.getElementById("expMonthSel");
  const months=new Set();
  months.add(today.slice(0,7));
  Object.values(expenses).forEach(e=>{ if(e.date) months.add(e.date.slice(0,7)); });
  const sorted=[...months].sort().reverse();
  sel.innerHTML=sorted.map(m=>`<option value="${m}"${m===selectedMonth?" selected":""}>${fmtMonth(m)}</option>`).join("");
  sel.onchange=()=>{ selectedMonth=sel.value; renderExpenses(); };
}

function renderExpenses() {
  populateMonthSel();
  const arr=Object.entries(expenses).map(([id,v])=>({id,...v})).filter(e=>e.date&&e.date.slice(0,7)===selectedMonth);
  arr.sort((a,b)=>(b.date>a.date?1:b.date<a.date?-1:0)||(b.ts||0)-(a.ts||0));

  const totalMonth=arr.reduce((s,e)=>s+(e.amount||0),0);
  const youTotal=arr.filter(e=>e.paidBy==="you").reduce((s,e)=>s+(e.amount||0),0);
  const partnerTotal=arr.filter(e=>e.paidBy==="partner").reduce((s,e)=>s+(e.amount||0),0);

  document.getElementById("balanceTotal").textContent=rp(totalMonth);
  document.getElementById("balanceSub").textContent=`${arr.length} transaksi`;

  const bs=document.getElementById("balanceSplit");
  bs.innerHTML=`
    <div class="split-card you">
      <div class="split-name you">${userName||"Kamu"}</div>
      <div class="split-amount">${rp(youTotal)}</div>
    </div>
    <div class="split-card partner">
      <div class="split-name partner">${partnerName}</div>
      <div class="split-amount">${rp(partnerTotal)}</div>
    </div>`;

  document.getElementById("pageSub").textContent=`${fmtMonth(selectedMonth)} · ${arr.length} transaksi`;

  const el=document.getElementById("expList"); el.innerHTML="";
  if(!arr.length) {
    el.innerHTML=`<div class="empty"><div class="empty-icon">💸</div><div class="empty-txt">Belum ada pengeluaran bulan ini.</div></div>`;
    return;
  }

  // group by date
  const byDate={};
  arr.forEach(e=>{ const d=e.date||today; if(!byDate[d]) byDate[d]=[]; byDate[d].push(e); });
  Object.keys(byDate).sort().reverse().forEach(date=>{
    const dh=document.createElement("div");
    dh.style.cssText="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;padding:8px 2px 5px;";
    dh.textContent=fmtDateFull(date);
    el.appendChild(dh);
    byDate[date].forEach(item=>{
      const div=document.createElement("div");
      div.className="exp-item";
      const catEmoji=(item.cat||"🎯").split(" ")[0];
      const whoLabel=item.paidBy==="you"?(userName||"Kamu"):item.paidBy==="partner"?partnerName:"Bersama";
      const whoClass=item.paidBy==="you"?"you":item.paidBy==="partner"?"partner":"bersama";
      div.innerHTML=`
        <div class="exp-icon">${catEmoji}</div>
        <div class="exp-body">
          <div class="exp-name">${item.desc||""}</div>
          <div class="exp-meta">
            <span>${item.cat||""}</span>
            ${item.note?`<span>${item.note}</span>`:""}
            <span>${item.type==="bersama"?"💕 Bersama":"👤 Personal"}</span>
          </div>
        </div>
        <div class="exp-amount">
          <div class="exp-rp">${rp(item.amount)}</div>
          <div class="exp-who ${whoClass}">${whoLabel}</div>
          <div style="display:flex;gap:3px;justify-content:flex-end;margin-top:4px;">
            <button class="act-btn" onclick="editExp('${item.id}')">✏️</button>
            <button class="act-btn" onclick="deleteExp('${item.id}')">🗑️</button>
          </div>
        </div>`;
      el.appendChild(div);
    });
  });
}

// ─────────────────────────────────────────────
// ── SAVINGS ──
// ─────────────────────────────────────────────
function openSavingForm(item) {
  document.getElementById("savingFormTitle").textContent = item?"Edit Target":"Target Baru";
  if(item) {
    document.getElementById("sName").value=item.name||"";
    document.getElementById("sEmoji").value=item.emoji||"🎯";
    document.getElementById("sTarget").value=item.target||"";
    document.getElementById("sDeadline").value=item.deadline||"";
    document.getElementById("sNote").value=item.note||"";
  } else {
    ["sName","sDeadline","sNote"].forEach(id=>document.getElementById(id).value="");
    document.getElementById("sTarget").value="";
    document.getElementById("sEmoji").value="🎯";
  }
  openForm("formSaving");
  setTimeout(()=>document.getElementById("sName").focus(),100);
}

window.submitSaving = function() {
  const name=document.getElementById("sName").value.trim();
  const target=Number(document.getElementById("sTarget").value);
  if(!name||!target) { showToast("Isi nama & target!"); return; }
  const data={
    name, target,
    emoji: document.getElementById("sEmoji").value||"🎯",
    deadline: document.getElementById("sDeadline").value,
    note: document.getElementById("sNote").value.trim(),
    createdBy: userName,
    ts: Date.now(),
  };
  if(editSavingId) {
    update(ref(db,"savings/"+editSavingId), data);
    showToast("Target diperbarui ✓");
  } else {
    push(ref(db,"savings"), data);
    showToast("Target ditambah ✓");
  }
  closeForm("formSaving");
};

window.openTopup = function(id) {
  document.getElementById("topupSavingId").value=id;
  document.getElementById("topupAmount").value="";
  document.getElementById("topupNote").value="";
  document.getElementById("topupFrom").value="you";
  openForm("formTopup");
  setTimeout(()=>document.getElementById("topupAmount").focus(),100);
};

window.submitTopup = function() {
  const id=document.getElementById("topupSavingId").value;
  const amount=Number(document.getElementById("topupAmount").value);
  if(!amount) { showToast("Isi jumlah!"); return; }
  const from=document.getElementById("topupFrom").value;
  const item=savings[id]; if(!item) return;
  const contribs=item.contribs||{};
  const myKey=encodeURIComponent(from==="you"?userName:partnerName);
  const current=contribs[myKey]||0;
  update(ref(db,"savings/"+id+"/contribs"), {[myKey]: current+amount});
  showToast(rp(amount)+" ditabung ✓");
  closeForm("formTopup");
};

window.editSaving = function(id) {
  editSavingId=id;
  openSavingForm(savings[id]);
};

window.deleteSaving = function(id) {
  if(!confirm("Hapus target ini?")) return;
  remove(ref(db,"savings/"+id));
  showToast("Target dihapus");
};

function renderSavings() {
  const arr=Object.entries(savings).map(([id,v])=>({id,...v}));
  arr.sort((a,b)=>(a.ts||0)-(b.ts||0));

  const list=document.getElementById("savingsList"); list.innerHTML="";

  if(!arr.length) {
    list.innerHTML=`<div class="empty"><div class="empty-icon">🐷</div><div class="empty-txt">Belum ada target tabungan.<br>Tap + untuk bikin target baru!</div></div>`;
    document.getElementById("pageSub").textContent="";
    return;
  }

  const totalTarget=arr.reduce((s,i)=>s+(i.target||0),0);
  const totalSaved=arr.reduce((s,i)=>s+Object.values(i.contribs||{}).reduce((a,b)=>a+b,0),0);
  document.getElementById("pageSub").textContent=`${rp(totalSaved)} / ${rp(totalTarget)}`;

  arr.forEach(item=>{
    const contribs=item.contribs||{};
    const saved=Object.values(contribs).reduce((a,b)=>a+b,0);
    const pct=Math.min(100,item.target?Math.round(saved/item.target*100):0);
    const done=pct>=100;
    const myKey=encodeURIComponent(userName);
    const partnerKey=encodeURIComponent(partnerName);
    const myAmt=contribs[myKey]||0;
    const partnerAmt=contribs[partnerKey]||0;

    const div=document.createElement("div");
    div.className="saving-card";
    div.innerHTML=`
      <div class="saving-top">
        <div>
          <div style="font-size:26px;margin-bottom:4px">${item.emoji||"🎯"}</div>
          <div class="saving-name">${item.name||""}</div>
          ${item.deadline?`<div class="saving-deadline">📅 Target ${fmtDate(item.deadline)}</div>`:""}
          ${item.note?`<div class="saving-deadline">${item.note}</div>`:""}
        </div>
        <div style="text-align:right">
          <div style="font-family:'Fraunces',serif;font-size:20px;font-weight:700">${pct}%</div>
          <div style="font-size:11px;color:var(--muted)">${done?"🎉 Tercapai!":"tersimpan"}</div>
        </div>
      </div>
      <div class="saving-progress"><div class="saving-fill${done?" done":""}" style="width:${pct}%"></div></div>
      <div class="saving-amounts">
        <span>${rp(saved)} terkumpul</span>
        <span>Target <strong>${rp(item.target)}</strong></span>
      </div>
      <div class="saving-contribs">
        <div class="contrib-box you">
          <div class="contrib-name you">${userName||"Kamu"}</div>
          <div class="contrib-val">${rp(myAmt)}</div>
        </div>
        <div class="contrib-box partner">
          <div class="contrib-name partner">${partnerName}</div>
          <div class="contrib-val">${rp(partnerAmt)}</div>
        </div>
      </div>
      <div class="saving-actions">
        <button class="btn-topup" onclick="openTopup('${item.id}')">+ Tabung</button>
        <button class="act-btn" onclick="editSaving('${item.id}')">✏️</button>
        <button class="act-btn" onclick="deleteSaving('${item.id}')">🗑️</button>
      </div>`;
    list.appendChild(div);
  });
}

// ── UTILS ──
function rp(v) { if(!v) return "Rp 0"; return "Rp "+Number(v).toLocaleString("id-ID"); }
function fmtDate(d) { if(!d) return ""; try { return new Date(d+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short"}); } catch(e){return d;} }
function fmtDateFull(d) { if(!d) return ""; try { return new Date(d+"T00:00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"}); } catch(e){return d;} }
function fmtMonth(m) { if(!m) return ""; try { const [y,mo]=m.split("-"); return new Date(y,mo-1,1).toLocaleDateString("id-ID",{month:"long",year:"numeric"}); } catch(e){return m;} }

// ── RENAME ──
window.openRename = function() {
  document.getElementById("renameInput").value = userName;
  document.getElementById("modalRename").classList.add("open");
  setTimeout(()=>{ const i=document.getElementById("renameInput"); i.focus(); i.select(); }, 100);
};

window.submitRename = function() {
  const newName = document.getElementById("renameInput").value.trim();
  if(!newName) { showToast("Nama tidak boleh kosong!"); return; }
  if(newName === userName) { document.getElementById("modalRename").classList.remove("open"); return; }
  const oldKey = encodeURIComponent(userName);
  const newKey = encodeURIComponent(newName);
  // update meta/names: remove old, add new
  remove(ref(db,"meta/names/"+oldKey));
  set(ref(db,"meta/names/"+newKey), newName);
  // update savings contribs keys
  Object.entries(savings).forEach(([id, item]) => {
    const contribs = item.contribs || {};
    if(contribs[oldKey] !== undefined) {
      const val = contribs[oldKey];
      const updated = {...contribs};
      delete updated[oldKey];
      updated[newKey] = (updated[newKey]||0) + val;
      set(ref(db,"savings/"+id+"/contribs"), updated);
    }
  });
  userName = newName;
  localStorage.setItem("berdua_name", newName);
  document.getElementById("syncLabel").textContent = newName;
  document.getElementById("modalRename").classList.remove("open");
  showToast("Nama diubah jadi "+newName+" ✓");
  renderSavings();
};

window.showToast = function(msg) {
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2200);
};

// expose for renderNeeds trigger
window.renderNeeds = renderNeeds;
window.renderExpenses = renderExpenses;
window.renderSavings = renderSavings;

// ── INIT ──
if(userName) {
  document.getElementById("setupScreen").style.display="none";
  document.getElementById("appRoot").style.display="block";
  document.getElementById("syncLabel").textContent=userName;
  startListeners();
  switchPage("Needs");
}


// ── THEME TOGGLE ──
const THEME_KEY = 'berdua_theme';
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
  localStorage.setItem(THEME_KEY, theme);
}

window.toggleTheme = function() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  applyTheme(current === 'dark' ? 'light' : 'dark');
};

// Init theme on load
(function() {
  const saved = localStorage.getItem(THEME_KEY) || 'dark';
  applyTheme(saved);
})();
</script>
