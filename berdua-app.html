    <title>Berdua 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Lora:ital,wght@0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f;
  --white: #1a1a1a;
  --surface: #1a1a1a;
  --surface2: #222222;
  --border: #2e2e2e;
  --border2: #3a3a3a;
  --text: #f0ede8;
  --muted: #888880;
  --text2: #aaa89e;
  --soft: #141414;
  --rose: #e8705a;
  --rose-soft: rgba(232,112,90,0.15);
  --green: #5ab87a;
  --green-soft: rgba(90,184,122,0.15);
  --green-border: rgba(90,184,122,0.25);
  --p1: #f87171; --p1bg: #2a1010;
  --p2: #fb923c; --p2bg: #2a1808;
  --p3: #fbbf24; --p3bg: #2a2008;
  --p4: #94a3b8; --p4bg: #1e1e1e;
  --r: 14px;
  --shadow: 0 2px 16px rgba(0,0,0,0.6);
}
[data-theme="light"] {
  --bg: #f7f4f0;
  --white: #ffffff;
  --surface: #ffffff;
  --surface2: #f0ede8;
  --border: #e8e2d9;
  --border2: #d8d0c8;
  --text: #1c1917;
  --muted: #9c948a;
  --text2: #7a6e66;
  --soft: #f2ede7;
  --rose: #d4614a;
  --rose-soft: rgba(212,97,74,0.1);
  --green: #3d8c5e;
  --green-soft: rgba(61,140,94,0.1);
  --green-border: rgba(61,140,94,0.2);
  --p1: #dc2626; --p1bg: #fef2f2;
  --p2: #ea580c; --p2bg: #fff7ed;
  --p3: #ca8a04; --p3bg: #fefce8;
  --p4: #6b7280; --p4bg: #f9fafb;
  --shadow: 0 2px 16px rgba(0,0,0,0.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body { transition: background 0.3s, color 0.3s; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }

/* \u2500\u2500 NAV \u2500\u2500 */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); border-top: 1px solid var(--border); display: flex; z-index: 200; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 4px 12px; gap: 3px; background: none; border: none; cursor: pointer; transition: all 0.15s; }
.nav-icon { font-size: 20px; transition: transform 0.2s; }
.nav-label { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.nav-btn.active .nav-label { color: var(--rose); }
.nav-btn.active .nav-icon { transform: scale(1.15); }

/* \u2500\u2500 HEADER \u2500\u2500 */
.header { background: var(--white); border-bottom: 1px solid var(--border); padding: 16px 16px 12px; position: sticky; top: 0; z-index: 100; }
.header-row { display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-family: 'Lora', serif; font-size: 22px; color: var(--text); letter-spacing: -0.02em; }
.header-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.sync-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--muted); background: var(--soft); border-radius: 99px; padding: 4px 10px; }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }
.sync-dot.offline { background: #f59e0b; }
.progress-bar { height: 3px; background: var(--border); border-radius: 99px; margin-top: 10px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 99px; transition: width 0.6s ease; }

/* \u2500\u2500 PAGES \u2500\u2500 */
.page { display: none; animation: fadeUp 0.25s ease; }
.page.active { display: block; }
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.main { max-width: 680px; margin: 0 auto; padding: 0 12px; }

/* \u2500\u2500 CARDS \u2500\u2500 */
.card { background: var(--white); border-radius: var(--r); border: 1px solid var(--border); }
.section { margin: 14px 0; }

/* \u2500\u2500 BUTTONS \u2500\u2500 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px; transition: all 0.15s; padding: 10px 18px; }
.btn-dark { background: var(--rose); color: #fff; }
.btn-dark:active { transform: scale(0.97); }
.btn-rose { background: var(--rose); color: white; }
.btn-ghost { background: transparent; border: 1.5px solid var(--border); color: var(--muted); font-size: 13px; padding: 8px 14px; }
.btn-ghost:active { background: var(--border); }

/* \u2500\u2500 FAB \u2500\u2500 */
.fab { position: fixed; bottom: 72px; right: 16px; width: 52px; height: 52px; border-radius: 50%; background: var(--rose); color: white; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 20px rgba(212,97,74,0.4); z-index: 150; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.fab:active { transform: scale(0.92); }

/* \u2500\u2500 FORM \u2500\u2500 */
.form-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 300; align-items: flex-end; }
.form-overlay.open { display: flex; animation: fadeIn 0.2s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.form-sheet { background: var(--white); border-radius: 20px 20px 0 0; padding: 20px 16px 32px; width: 100%; max-height: 92vh; overflow-y: auto; animation: slideUp 0.3s ease; }
@keyframes slideUp { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }
.form-handle { width: 40px; height: 4px; background: var(--border); border-radius: 99px; margin: 0 auto 16px; }
.form-title { font-family: 'Lora', serif; font-size: 18px; margin-bottom: 16px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.fg { display: flex; flex-direction: column; gap: 5px; }
.fg.full { grid-column: 1/-1; }
.fg label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.fg input, .fg select, .fg textarea { font-family: 'DM Sans', sans-serif; border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: 14px; background: var(--soft); outline: none; width: 100%; transition: border 0.15s; color: var(--text); }
.fg input:focus, .fg select:focus, .fg textarea:focus { border-color: var(--rose); background: var(--white); }
.fg textarea { resize: vertical; }
.form-actions { display: flex; gap: 8px; margin-top: 16px; }

/* \u2500\u2500 NAME SETUP \u2500\u2500 */
.setup-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; }
.setup-screen h1 { font-family: 'Lora', serif; font-size: 28px; margin-bottom: 8px; }
.setup-screen p { color: var(--muted); font-size: 14px; margin-bottom: 28px; line-height: 1.6; }
.setup-input { max-width: 280px; width: 100%; padding: 12px 16px; font-family: 'DM Sans', sans-serif; font-size: 16px; border: 2px solid var(--border); border-radius: 12px; background: var(--surface); outline: none; text-align: center; }
.setup-input:focus { border-color: var(--rose); }
.setup-emoji { font-size: 56px; margin-bottom: 20px; }

/* \u2500\u2500 NEEDS LIST \u2500\u2500 */
.p-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 7px; margin: 14px 0 10px; }
.p-card { border-radius: 12px; padding: 10px 11px; cursor: pointer; border: 1.5px solid transparent; transition: all 0.15s; }
.p-card:active { transform: scale(0.97); }
.p-card-top { display: flex; align-items: center; gap: 5px; }
.p-dot { width: 7px; height: 7px; border-radius: 50%; }
.p-lbl { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
.p-name { font-weight: 600; font-size: 13px; color: var(--text); margin-top: 2px; }
.p-count { font-size: 12px; font-weight: 700; margin-top: 3px; }

.filter-row { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.chip { white-space: nowrap; padding: 6px 13px; border-radius: 99px; font-size: 12px; font-weight: 500; border: 1.5px solid var(--border); background: var(--surface); color: var(--text2); cursor: pointer; transition: all 0.15s; flex-shrink: 0; }
.chip.active { background: var(--rose); color: #fff; border-color: var(--rose); }
.chip:active { transform: scale(0.95); }

.search-wrap { position: relative; margin-bottom: 8px; }
.search-wrap input { width: 100%; padding: 9px 14px 9px 34px; border: 1.5px solid var(--border); border-radius: 11px; font-family: 'DM Sans', sans-serif; font-size: 14px; background: var(--white); outline: none; }
.search-wrap input:focus { border-color: var(--text); }
.search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 13px; pointer-events: none; }

.sort-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.sort-row select { font-family: 'DM Sans', sans-serif; font-size: 12px; border: 1.5px solid var(--border); border-radius: 8px; padding: 5px 10px; background: var(--surface); color: var(--text2); outline: none; }

.items-list { display: flex; flex-direction: column; gap: 7px; }
.item-card { background: var(--white); border-radius: var(--r); border: 1px solid var(--border); padding: 12px 13px; transition: all 0.2s; }
.item-card.done { opacity: 0.6; background: var(--surface2); }
.item-top { display: flex; gap: 9px; align-items: flex-start; }
.item-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.item-body { flex: 1; min-width: 0; }
.item-name { font-weight: 600; font-size: 15px; }
.item-name.striked { text-decoration: line-through; opacity: 0.45; }
.item-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; align-items: center; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
.item-meta { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 8px; }
.overdue { color: #ef4444 !important; font-weight: 700; }
.item-note { font-size: 12px; color: var(--text2); font-style: italic; margin-top: 3px; }
.added-by { font-size: 11px; color: var(--text2); margin-top: 3px; }
.item-actions { display: flex; gap: 2px; flex-shrink: 0; }
.act-btn { background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px 5px; border-radius: 7px; transition: background 0.15s; }
.act-btn:active { background: var(--border); }

.summary-card { padding: 13px 15px; margin-top: 12px; }
.summary-row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.s-item { text-align: center; }
.s-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.s-val { font-weight: 700; font-size: 13px; color: var(--text); margin-top: 2px; }
.s-total .s-val { font-family: 'Lora', serif; font-size: 17px; }

/* \u2500\u2500 EXPENSES \u2500\u2500 */
.balance-card { padding: 20px; margin: 14px 0; background: var(--surface); color: var(--text); border-radius: var(--r); border: 1px solid var(--border); }
.balance-card .bc-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.balance-card .bc-amount { font-family: 'Lora', serif; font-size: 30px; margin: 4px 0 2px; }
.balance-card .bc-sub { font-size: 12px; color: var(--muted); }
.balance-split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.split-card { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); }
.split-card.you { background: var(--rose-soft); border-color: var(--rose-border, rgba(200,90,66,0.2)); }
.split-card.partner { background: var(--green-soft); border-color: var(--green-border); }
.split-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.split-name.you { color: var(--rose); }
.split-name.partner { color: var(--green); }
.split-amount { font-family: 'Lora', serif; font-size: 18px; margin-top: 2px; color: var(--text); }

.exp-list { display: flex; flex-direction: column; gap: 7px; }
.exp-item { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); padding: 11px 13px; display: flex; align-items: center; gap: 11px; }
.exp-icon { font-size: 24px; flex-shrink: 0; }
.exp-body { flex: 1; min-width: 0; }
.exp-name { font-weight: 600; font-size: 14px; }
.exp-meta { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
.exp-amount { text-align: right; flex-shrink: 0; }
.exp-rp { font-weight: 700; font-size: 15px; font-family: 'Lora', serif; }
.exp-who { font-size: 11px; margin-top: 2px; font-weight: 600; }
.exp-who.you { color: var(--rose); }
.exp-who.partner { color: var(--green); }
.exp-who.bersama { color: var(--muted); }

.month-selector { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
.month-selector::-webkit-scrollbar { display: none; }

/* \u2500\u2500 SAVINGS \u2500\u2500 */
.savings-list { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
.saving-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); padding: 15px; }
.saving-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.saving-emoji { font-size: 28px; }
.saving-name { font-weight: 700; font-size: 16px; }
.saving-deadline { font-size: 12px; color: var(--muted); margin-top: 2px; }
.saving-progress { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; margin: 8px 0; }
.saving-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--rose), #e8855e); transition: width 0.6s ease; }
.saving-fill.done { background: linear-gradient(90deg, var(--green), #5ab87a); }
.saving-amounts { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.saving-amounts strong { color: var(--text); font-size: 14px; font-family: 'Lora', serif; }
.saving-contribs { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 10px; }
.contrib-box { padding: 8px 10px; border-radius: 10px; }
.contrib-box.you { background: var(--rose-soft); }
.contrib-box.partner { background: var(--green-soft); }
.contrib-name { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.contrib-name.you { color: var(--rose); }
.contrib-name.partner { color: var(--green); }
.contrib-val { font-weight: 700; font-size: 13px; margin-top: 1px; }
.saving-actions { display: flex; gap: 6px; margin-top: 10px; }
.btn-topup { background: var(--rose-soft); color: var(--rose); border: none; border-radius: 8px; padding: 7px 14px; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.15s; flex: 1; }
.btn-topup:active { transform: scale(0.97); }

/* \u2500\u2500 TOAST \u2500\u2500 */
.toast { position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--surface2); color: var(--text); border: 1px solid var(--border2); padding: 10px 18px; border-radius: 99px; font-size: 13px; font-weight: 500; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 500; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* \u2500\u2500 EMPTY \u2500\u2500 */
.empty { text-align: center; padding: 44px 20px; color: var(--muted); }
.empty-icon { font-size: 40px; margin-bottom: 10px; }
.empty-txt { font-size: 14px; }

/* \u2500\u2500 SECTION HEADER \u2500\u2500 */
.sec-header { display: flex; justify-content: space-between; align-items: center; padding: 4px 0 10px; }
.sec-title { font-family: 'Lora', serif; font-size: 16px; }

/* ── THEME TRANSITIONS ── */
.header, .bottom-nav, .card, .item-card, .exp-item, .saving-card,
.form-sheet, .modal-box, .sort-row select, .search-wrap input,
.fg input, .fg select, .fg textarea, .pri-grid div, .pGrid-card {
  transition: background 0.3s, border-color 0.3s, color 0.3s;
}

/* ── DARK MODE SPECIFIC FIXES ── */
:root .btn-ghost { border-color: var(--border2); }
:root .sort-row select, :root .search-wrap input { color: var(--text); background: var(--surface2); border-color: var(--border2); }
:root .fg input, :root .fg select, :root .fg textarea { background: var(--soft); color: var(--text); border-color: var(--border2); }
:root .fg input::placeholder, :root .fg textarea::placeholder { color: var(--text2); }
:root .search-wrap input::placeholder { color: var(--muted); }
:root .setup-input { background: var(--surface); color: var(--text); border-color: var(--border2); }
:root .modal-box { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 20px 16px; }
</style>
</head>
<body>

<!-- Setup screen -->
<div class="setup-screen" id="setupScreen">
  <div class="setup-emoji">💕</div>
  <h1>Halo!</h1>
  <p>Sebelum mulai, siapa kamu?<br>Biar keliatan siapa yang nambah atau bayar.</p>
  <input class="setup-input" id="setupInput" type="text" placeholder="Nama kamu..." maxlength="20" onkeydown="if(event.key==='Enter')saveName()">
  <div style="height:14px"></div>
  <button class="btn btn-rose" onclick="saveName()" style="width:180px">Mulai →</button>
</div>

<!-- Main app -->
<div id="appRoot" style="display:none">

  <!-- Header -->
  <div class="header" id="appHeader">
    <div class="header-row">
      <div>
        <h1 id="pageTitle">Berdua 💕</h1>
        <div class="header-sub" id="pageSub"></div>
      </div>
      <button onclick="toggleTheme()" id="themeBtn" style="background:none;border:1px solid var(--border2);border-radius:99px;padding:5px 11px;cursor:pointer;font-size:11px;font-weight:700;color:var(--muted);font-family:var(--ff-body);transition:all 0.2s;">☀️ Light</button>
        <div class="sync-pill">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncLabel">Sync</span>
      </div>
    </div>
    <div class="progress-bar" id="headerProgress" style="display:none">
      <div class="progress-fill" id="progressFill" style="width:0%;background:linear-gradient(90deg,#22c55e,#16a34a)"></div>
    </div>
  </div>

  <!-- Pages -->
  <div class="page active" id="pageNeeds">
    <div class="main">
      <div class="p-grid" id="pGrid"></div>
      <div class="filter-row" id="filterRow"></div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="needsSearch" placeholder="Cari item..." oninput="renderNeeds()">
      </div>
      <div class="sort-row">
        <select id="needsSort" onchange="renderNeeds()">
          <option value="prioritas">Sort: Prioritas</option>
          <option value="deadline">Sort: Deadline</option>
          <option value="harga">Sort: Harga</option>
          <option value="terbaru">Sort: Terbaru</option>
        </select>
      </div>
      <div class="items-list" id="needsList"></div>
      <div class="card summary-card" id="needsSummary" style="display:none">
        <div class="summary-row" id="summaryRow"></div>
      </div>
      <div style="height:16px"></div>
    </div>
  </div>

    <!-- PAGE: WISHLIST -->
  <div class="page" id="pageWishlist">
    <div class="main">
      <div id="wishlistSummary"></div>
      <div id="wishlistItems"></div>
      <div style="height:8px"></div>
    </div>
  </div>

  <div class="page" id="pageExpenses">
    <div class="main">
      <div class="balance-card" id="balanceCard">
        <div class="bc-title">Total Pengeluaran Bulan Ini</div>
        <div class="bc-amount" id="balanceTotal">Rp 0</div>
        <div class="bc-sub" id="balanceSub">0 transaksi</div>
      </div>
      <div class="balance-split" id="balanceSplit"></div>
      <div class="sec-header">
        <div class="sec-title">Riwayat</div>
        <select id="expMonthSel" onchange="renderExpenses()" style="font-family:'DM Sans',sans-serif;font-size:12px;border:1.5px solid var(--border);border-radius:8px;padding:5px 10px;background:var(--white);color:var(--muted);outline:none;"></select>
      </div>
      <div class="exp-list" id="expList"></div>
      <div style="height:16px"></div>
    </div>
  </div>

  <div class="page" id="pageSavings">
    <div class="main">
      <div class="savings-list" id="savingsList"></div>
      <div style="height:16px"></div>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="navNeeds" onclick="switchPage('Needs')">
      <span class="nav-icon">📋</span>
      <span class="nav-label">List</span>
    </button>
    <button class="nav-btn" id="navWishlist" onclick="switchPage('Wishlist')">
      <span class="nav-icon">⭐</span>
      <span class="nav-label">Wishlist</span>
    </button>
    <button class="nav-btn" id="navExpenses" onclick="switchPage('Expenses')">
      <span class="nav-icon">💸</span>
      <span class="nav-label">Pengeluaran</span>
    </button>
    <button class="nav-btn" id="navSavings" onclick="switchPage('Savings')">
      <span class="nav-icon">🐷</span>
      <span class="nav-label">Tabungan</span>
    </button>
  </nav>

  <button class="fab" id="fab" onclick="openFab()">+</button>
</div>

<!-- \u2500\u2500 FORM SHEETS \u2500\u2500 -->

<!-- Needs Form -->
<div class="form-overlay" id="formNeeds">
  <div class="form-sheet">
    <div class="form-handle"></div>
    <div class="form-title" id="needsFormTitle">Item Baru</div>
    <div class="form-grid">
      <div class="fg full"><label>Nama Kebutuhan *</label><input type="text" id="fNama" placeholder="e.g. Obat flu, Bayar listrik..."></div>
      <div class="fg"><label>Kategori</label><select id="fKat"></select></div>
      <div class="fg"><label>Prioritas</label>
        <select id="fPrio">
          <option value="1">P1 — Must Have</option>
          <option value="2">P2 — Should Have</option>
          <option value="3">P3 — Nice to Have</option>
          <option value="4">P4 — Can Wait</option>
        </select>
      </div>
      <div class="fg"><label>Qty</label><input type="number" id="fQty" value="1" min="1"></div>
      <div class="fg"><label>Satuan</label><input type="text" id="fSatuan" placeholder="pcs, kg..."></div>
      <div class="fg"><label>Estimasi Harga</label><input type="number" id="fHarga" placeholder="0"></div>
      <div class="fg"><label>Deadline</label><input type="date" id="fDeadline"></div>
      <div class="fg"><label>Toko / Sumber</label><input type="text" id="fToko" placeholder="Indomaret..."></div>
      <div class="fg full"><label>Catatan</label><textarea id="fNotes" rows="2" placeholder="Info tambahan..."></textarea></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-dark" onclick="submitNeed()">Simpan</button>
      <button class="btn btn-ghost" onclick="closeForm('formNeeds')">Batal</button>
    </div>
  </div>
</div>

<!-- Expense Form -->
<div class="form-overlay" id="formExpense">
  <div class="form-sheet">
    <div class="form-handle"></div>
    <div class="form-title" id="expFormTitle">Catat Pengeluaran</div>
    <div class="form-grid">
      <div class="fg full"><label>Keterangan *</label><input type="text" id="eDesc" placeholder="e.g. Makan malam, Bensin..."></div>
      <div class="fg"><label>Jumlah (Rp) *</label><input type="number" id="eAmount" placeholder="0"></div>
      <div class="fg"><label>Kategori</label><select id="eCat"></select></div>
      <div class="fg"><label>Dibayar oleh</label>
        <select id="ePaidBy">
          <option value="you">Kamu</option>
          <option value="partner">Pasangan</option>
          <option value="bersama">Bersama (kas)</option>
        </select>
      </div>
      <div class="fg"><label>Tipe</label>
        <select id="eType">
          <option value="bersama">Kebutuhan bersama</option>
          <option value="personal">Personal</option>
        </select>
      </div>
      <div class="fg"><label>Tanggal</label><input type="date" id="eDate"></div>
      <div class="fg full"><label>Catatan</label><input type="text" id="eNote" placeholder="Opsional..."></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-dark" onclick="submitExpense()">Simpan</button>
      <button class="btn btn-ghost" onclick="closeForm('formExpense')">Batal</button>
    </div>
  </div>
</div>

<!-- Saving Form -->
<div class="form-overlay" id="formSaving">
  <div class="form-sheet">
    <div class="form-handle"></div>
    <div class="form-title" id="savingFormTitle">Target Baru</div>
    <div class="form-grid">
      <div class="fg full"><label>Nama Target *</label><input type="text" id="sName" placeholder="e.g. Liburan, TV baru..."></div>
      <div class="fg"><label>Emoji</label><input type="text" id="sEmoji" placeholder="🎯" maxlength="2"></div>
      <div class="fg"><label>Target (Rp) *</label><input type="number" id="sTarget" placeholder="0"></div>
      <div class="fg"><label>Deadline</label><input type="date" id="sDeadline"></div>
      <div class="fg full"><label>Catatan</label><input type="text" id="sNote" placeholder="Opsional..."></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-dark" onclick="submitSaving()">Simpan</button>
      <button class="btn btn-ghost" onclick="closeForm('formSaving')">Batal</button>
    </div>
  </div>
</div>

<!-- Topup Form -->
<div class="form-overlay" id="formTopup">
  <div class="form-sheet">
    <div class="form-handle"></div>
    <div class="form-title">Tambah Tabungan</div>
    <input type="hidden" id="topupSavingId">
    <div class="form-grid">
      <div class="fg"><label>Jumlah (Rp) *</label><input type="number" id="topupAmount" placeholder="0"></div>
      <div class="fg"><label>Dari</label>
        <select id="topupFrom">
          <option value="you">Kamu</option>
          <option value="partner">Pasangan</option>
        </select>
      </div>
      <div class="fg full"><label>Catatan</label><input type="text" id="topupNote" placeholder="Opsional..."></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-dark" onclick="submitTopup()">Tambah</button>
      <button class="btn btn-ghost" onclick="closeForm('formTopup')">Batal</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script type="module">

// Get computed CSS variable value
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
const STATUS = ["⬜ Belum","🔄 Proses","✅ Selesai"];

let userName = localStorage.getItem("berdua_name") || "";
let partnerName = "Pasangan";

const today = new Date().toISOString().split("T")[0];
selectedMonth = today.slice(0,7);

// ── SETUP ──
function populate() {
  // needs categories
  const fc = document.getElementById("fKat");
  fc.innerHTML = ""; CATS_NEEDS.forEach(c=>{ const o=document.createElement("option");o.value=c;o.textContent=c;fc.appendChild(o); });
  // expense categories
  const ec = document.getElementById("eCat");
  ec.innerHTML = ""; CATS_EXP.forEach(c=>{ const o=document.createElement("option");o.value=c;o.textContent=c;ec.appendChild(o); });
}
populate();

// ── FIREBASE LISTENERS ──
function startListeners() {
  onValue(ref(db,"needs"), snap => {
    needs = snap.val() || {};
    if(currentPage==="Needs") renderNeeds();
    syncIndicator(true);
  });
  onValue(ref(db,"expenses"), snap => {
    expenses = snap.val() || {};
    if(currentPage==="Expenses") renderExpenses();
    syncIndicator(true);
  });
  onValue(ref(db,"savings"), snap => {
    savings = snap.val() || {};
    if(currentPage==="Savings") renderSavings();
    syncIndicator(true);
  });
  onValue(ref(db,"wishlist"), snap => {
    wishlist = snap.val() || {};
    if(currentPage==="Wishlist") renderWishlist();
    syncIndicator(true);
  });
  onValue(ref(db,"meta"), snap => {
    const m = snap.val() || {};
    if(m.names) {
      const others = Object.values(m.names).filter(n=>n!==userName);
      if(others.length) partnerName = others[0];
    }
    // register own name
    set(ref(db,"meta/names/"+encodeURIComponent(userName)), userName);
  });
}

function syncIndicator(ok) {
  document.getElementById("syncDot").className = "sync-dot" + (ok?"" :" offline");
}

// ── NAME ──
window.saveName = function() {
  const v = document.getElementById("setupInput").value.trim();
  if(!v) return;
  userName = v;
  localStorage.setItem("berdua_name", v);
  document.getElementById("setupScreen").style.display = "none";
  document.getElementById("appRoot").style.display = "block";
  document.getElementById("syncLabel").textContent = userName;
  set(ref(db,"meta/names/"+encodeURIComponent(userName)), userName);
  startListeners();
  switchPage("Needs");
  showToast("Halo "+userName+" 👋");
};

// ── PAGE SWITCH ──
window.switchPage = function(page) {
  currentPage = page;
  ["Needs","Wishlist","Expenses","Savings"].forEach(p => {
    document.getElementById("page"+p).classList.toggle("active", p===page);
    document.getElementById("nav"+p).classList.toggle("active", p===page);
  });
  const titles = {Needs:"List Kebutuhan",Wishlist:"Wishlist Berdua",Expenses:"Catatan Keuangan",Savings:"Tabungan Bersama"};
  document.getElementById("pageTitle").textContent = titles[page];
  document.getElementById("headerProgress").style.display = page==="Needs" ? "block" : "none";
  if(page==="Needs") { renderNeeds(); }
  if(page==="Expenses") { populateMonthSel(); renderExpenses(); }
  if(page==="Savings") renderSavings();
};

window.openFab = function() {
  if(currentPage==="Needs") { editNeedId=null; openNeedForm(); }
  else if(currentPage==="Expenses") { editExpId=null; openExpForm(); }
  else if(currentPage==="Wishlist") {
    editWishId=null;
    document.getElementById("wFormTitle").textContent="Wishlist Baru";
    ["wNama","wHarga","wKat","wCatatan"].forEach(i=>document.getElementById(i).value="");
    document.getElementById("wPrio").value="2";
    openForm("wishForm");
  } else if(currentPage==="Savings") { editSavingId=null; openSavingForm(); }
};

// ── FORM UTILS ──
window.closeForm = function(id) {
  document.getElementById(id).classList.remove("open");
};
function openForm(id) {
  document.getElementById(id).classList.add("open");
  // close on backdrop tap
  document.getElementById(id).onclick = function(e) {
    if(e.target===this) closeForm(id);

function openNeedForm(item) {
  document.getElementById("needsFormTitle").textContent = item ? "Edit Item" : "Item Baru";
  if(item) {
    document.getElementById("fNama").value = item.nama||"";
    document.getElementById("fKat").value = item.kategori||CATS_NEEDS[0];
    document.getElementById("fPrio").value = item.prioritas||1;
    document.getElementById("fQty").value = item.qty||1;
    document.getElementById("fSatuan").value = item.satuan||"";
    document.getElementById("fHarga").value = item.harga||"";
    document.getElementById("fDeadline").value = item.deadline||"";
    document.getElementById("fToko").value = item.toko||"";
    document.getElementById("fNotes").value = item.notes||"";
  } else {
    ["fNama","fSatuan","fHarga","fDeadline","fToko","fNotes"].forEach(id=>document.getElementById(id).value="");
    document.getElementById("fQty").value=1;
    document.getElementById("fPrio").value=1;
    document.getElementById("fKat").value=CATS_NEEDS[0];

  openForm("formNeeds");

}

window.submitNeed = function() {
  const nama = document.getElementById("fNama").value.trim();
  if(!nama) { showToast("Nama tidak boleh kosong!"); return; }
  const data = {
    nama,
    kategori: document.getElementById("fKat").value,
    prioritas: Number(document.getElementById("fPrio").value),
    qty: Number(document.getElementById("fQty").value)||1,
    satuan: document.getElementById("fSatuan").value.trim(),

window.cycleStatus = function(id) {
  const item = needs[id]; if(!item) return;
  const idx = STATUS.indexOf(item.status);
  update(ref(db,"needs/"+id), {status: STATUS[(idx+1)%STATUS.length]});
};

window.editNeed = function(id) {
  editNeedId = id;
  openNeedForm(needs[id]);
};

window.deleteNeed = function(id) {
  if(!confirm("Hapus item ini?")) return;
  remove(ref(db,"needs/"+id));
  showToast("Item dihapus");
};

function renderNeeds() {
  const arr = Object.entries(needs).map(([id,v])=>({id,...v}));
  const search = document.getElementById("needsSearch").value.toLowerCase();
  const sort = document.getElementById("needsSort").value;

  let filtered = [...arr];
  if(filterPrio) filtered=filtered.filter(i=>i.prioritas==filterPrio);
  if(filterStatus!=="Semua") filtered=filtered.filter(i=>i.status===filterStatus);
  if(search) filtered=filtered.filter(i=>(i.nama||"").toLowerCase().includes(search)||(i.kategori||"").toLowerCase().includes(search));
  filtered.sort((a,b)=>{
    if(sort==="prioritas") return (a.prioritas||4)-(b.prioritas||4);
    if(sort==="deadline") return (a.deadline||"9999")>(b.deadline||"9999")?1:-1;
    if(sort==="harga") return (b.harga*b.qty)-(a.harga*a.qty);
    return (b.ts||0)-(a.ts||0);
  });

  // priority grid
  const pg = document.getElementById("pGrid"); pg.innerHTML="";
  PRIO.forEach(p=>{
    const cnt = arr.filter(i=>i.prioritas==p.level).length;
    const div=document.createElement("div");
    div.className="p-card"+(filterPrio===p.level?" active":"");
    div.style.cssText=`background:${cssVar(p.bgVar)};opacity:${filterPrio&&filterPrio!==p.level?0.45:1}`;
    if(filterPrio===p.level) div.style.borderColor=cssVar(p.colorVar);
    div.innerHTML=`<div class="p-card-top"><div class="p-dot" style="background:${cssVar(p.colorVar)}"></div><span class="p-lbl" style="color:${cssVar(p.colorVar)}">P${p.level}</span></div><div class="p-name">${p.label}</div><div class="p-count" style="color:${cssVar(p.colorVar)}">${cnt} item</div>`;
    div.onclick=()=>{filterPrio=filterPrio===p.level?0:p.level;renderNeeds();};
    pg.appendChild(div);
  });

  // filter chips
  const fr=document.getElementById("filterRow"); fr.innerHTML="";
  ["Semua",...STATUS].forEach(s=>{
    const sp=document.createElement("span");
    sp.className="chip"+(filterStatus===s?" active":"");
    sp.textContent=s;
    sp.onclick=()=>{filterStatus=s;renderNeeds();};
    fr.appendChild(sp);
  });

  // items
  const list=document.getElementById("needsList"); list.innerHTML="";
  if(!filtered.length) {
    list.innerHTML=`<div class="empty"><div class="empty-icon">📋</div><div class="empty-txt">Belum ada item. Tap + untuk nambah!</div></div>`;
  } else {
    filtered.forEach(item=>{
      const p=PRIO.find(x=>x.level==item.prioritas)||PRIO[3];
      const done=item.status==="✅ Selesai";
      const overdue=item.deadline&&item.deadline<today&&!done;
      const div=document.createElement("div");
      div.className="item-card"+(done?" done":"");
      div.innerHTML=`<div class="item-top">
        <div class="item-dot" style="background:${cssVar(p.colorVar)};margin-top:5px"></div>
        <div class="item-body">
          <div class="item-name${done?" striked":""}">${item.nama||""}</div>
          <div class="item-tags">
            <span class="tag" style="background:${cssVar(p.bgVar)};color:${cssVar(p.colorVar)}">P${p.level} ${p.label}</span>
            <span style="font-size:11px;color:var(--text2)">${item.kategori||""}</span>
          </div>
          <div class="item-meta">
            <span>${item.qty||1} ${item.satuan||""}${item.harga?" · "+rp(item.harga*(item.qty||1)):""}</span>
            ${item.deadline?`<span class="${overdue?"overdue":""}">${overdue?"⚠️ ":"📅 "}${fmtDate(item.deadline)}</span>`:""}
            ${item.toko?`<span>📍 ${item.toko}</span>`:""}
          </div>
          ${item.notes?`<div class="item-note">"${item.notes}"</div>`:""}
          ${item.addedBy?`<div class="added-by">oleh ${item.addedBy}</div>`:""}
        </div>
        <div class="item-actions">
          <button class="act-btn" onclick="cycleStatus('${item.id}')">${item.status==="✅ Selesai"?"✅":item.status==="🔄 Proses"?"🔄":"⬜"}</button>
          <button class="act-btn" onclick="editNeed('${item.id}')">✏️️</button>
          <button class="act-btn" onclick="deleteNeed('${item.id}')">🗑️</button>
        </div>
      </div>`;
      list.appendChild(div);
    });
  }

  // header update
  const done=arr.filter(i=>i.status==="✅ Selesai").length;
  const total=arr.length;
  document.getElementById("progressFill").style.width=(total?(done/total*100):0)+"%";
  const totalEst=arr.reduce((s,i)=>s+(Number(i.harga)*Number(i.qty||1)||0),0);
  document.getElementById("pageSub").textContent=`${done}/${total} selesai · Est. ${rp(totalEst)}`;

  // summary
  const sc=document.getElementById("needsSummary");
  const sr=document.getElementById("summaryRow");
  if(arr.length) {
    sc.style.display="block";
    sr.innerHTML=PRIO.map(p=>{
      const t=arr.filter(i=>i.prioritas==p.level).reduce((s,i)=>s+(Number(i.harga)*(Number(i.qty)||1)||0),0);
      return t?`<div class="s-item"><div class="s-label" style="color:${cssVar(p.colorVar)}">P${p.level}</div><div class="s-val">${rp(t)}</div></div>`:"";
    }).join("")+`<div class="s-item s-total"><div class="s-label" style="color:var(--muted)">Total</div><div class="s-val" style="font-family:'Lora',serif;font-size:16px">${rp(totalEst)}</div></div>`;
  } else { sc.style.display="none"; }
}

function populateMonthSel() {
  const sel=document.getElementById("expMonthSel");
  const months=new Set();
  months.add(today.slice(0,7));
  Object.values(expenses).forEach(e=>{ if(e.date) months.add(e.date.slice(0,7)); });
  const sorted=[...months].sort().reverse();
  sel.innerHTML=sorted.map(m=>`<option value="${m}"${m===selectedMonth?" selected":""}>${fmtMonth(m)}</option>`).join("");
  sel.onchange=()=>{ selectedMonth=sel.value; renderExpenses(); };
}

function renderExpenses() {
  populateMonthSel();
  const arr=Object.entries(expenses).map(([id,v])=>({id,...v})).filter(e=>e.date&&e.date.slice(0,7)===selectedMonth);
  arr.sort((a,b)=>(b.date>a.date?1:b.date<a.date?-1:0)||(b.ts||0)-(a.ts||0));

  const totalMonth=arr.reduce((s,e)=>s+(e.amount||0),0);
  const youTotal=arr.filter(e=>e.paidBy==="you").reduce((s,e)=>s+(e.amount||0),0);
  const partnerTotal=arr.filter(e=>e.paidBy==="partner").reduce((s,e)=>s+(e.amount||0),0);

  document.getElementById("balanceTotal").textContent=rp(totalMonth);
  document.getElementById("balanceSub").textContent=`${arr.length} transaksi`;

  const bs=document.getElementById("balanceSplit");
  bs.innerHTML=`
    <div class="split-card you">
      <div class="split-name you">${userName||"Kamu"}</div>
      <div class="split-amount">${rp(youTotal)}</div>
    </div>
    <div class="split-card partner">
      <div class="split-name partner">${partnerName}</div>
      <div class="split-amount">${rp(partnerTotal)}</div>
    </div>`;

  document.getElementById("pageSub").textContent=`${fmtMonth(selectedMonth)} · ${arr.length} transaksi`;

  const el=document.getElementById("expList"); el.innerHTML="";
  if(!arr.length) {
    el.innerHTML=`<div class="empty"><div class="empty-icon">💸</div><div class="empty-txt">Belum ada pengeluaran bulan ini.</div></div>`;
    return;
  }

  // group by date
  const byDate={};
  arr.forEach(e=>{ const d=e.date||today; if(!byDate[d]) byDate[d]=[]; byDate[d].push(e); });
  Object.keys(byDate).sort().reverse().forEach(date=>{
    const dh=document.createElement("div");
    dh.style.cssText="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;padding:8px 2px 5px;";
    dh.textContent=fmtDateFull(date);
    el.appendChild(dh);
    byDate[date].forEach(item=>{
      const div=document.createElement("div");
      div.className="exp-item";
      const catEmoji=(item.cat||"🎯").split(" ")[0];
      const whoLabel=item.paidBy==="you"?(userName||"Kamu"):item.paidBy==="partner"?partnerName:"Bersama";
      const whoClass=item.paidBy==="you"?"you":item.paidBy==="partner"?"partner":"bersama";
      div.innerHTML=`
        <div class="exp-icon">${catEmoji}</div>
        <div class="exp-body">
          <div class="exp-name">${item.desc||""}</div>
          <div class="exp-meta">
            <span>${item.cat||""}</span>
            ${item.note?`<span>${item.note}</span>`:""}
            <span>${item.type==="bersama"?"👫 Bersama":"👤 Personal"}</span>
          </div>
        </div>
        <div class="exp-amount">
          <div class="exp-rp">${rp(item.amount)}</div>
          <div class="exp-who ${whoClass}">${whoLabel}</div>
          <div style="display:flex;gap:3px;justify-content:flex-end;margin-top:4px;">
            <button class="act-btn" onclick="editExp('${item.id}')">✏️️</button>
            <button class="act-btn" onclick="deleteExp('${item.id}')">🗑️</button>
          </div>
        </div>`;
      el.appendChild(div);
    });
  });
}

function renderSavings() {
  const arr=Object.entries(savings).map(([id,v])=>({id,...v}));
  arr.sort((a,b)=>(a.ts||0)-(b.ts||0));

  const list=document.getElementById("savingsList"); list.innerHTML="";

  if(!arr.length) {
    list.innerHTML=`<div class="empty"><div class="empty-icon">🐷</div><div class="empty-txt">Belum ada target tabungan.<br>Tap + untuk bikin target baru!</div></div>`;
    document.getElementById("pageSub").textContent="";
    return;
  }

  const totalTarget=arr.reduce((s,i)=>s+(i.target||0),0);
  const totalSaved=arr.reduce((s,i)=>s+Object.values(i.contribs||{}).reduce((a,b)=>a+b,0),0);
  document.getElementById("pageSub").textContent=`${rp(totalSaved)} / ${rp(totalTarget)}`;

  arr.forEach(item=>{
    const contribs=item.contribs||{};
    const saved=Object.values(contribs).reduce((a,b)=>a+b,0);
    const pct=Math.min(100,item.target?Math.round(saved/item.target*100):0);
    const done=pct>=100;
    const myKey=encodeURIComponent(userName);
    const partnerKey=encodeURIComponent(partnerName);
    const myAmt=contribs[myKey]||0;
    const partnerAmt=contribs[partnerKey]||0;

    const div=document.createElement("div");
    div.className="saving-card";
    div.innerHTML=`
      <div class="saving-top">
        <div>
          <div style="font-size:26px;margin-bottom:4px">${item.emoji||"🎯"}</div>
          <div class="saving-name">${item.name||""}</div>
          ${item.deadline?`<div class="saving-deadline">📅 Target ${fmtDate(item.deadline)}</div>`:""}
          ${item.note?`<div class="saving-deadline">${item.note}</div>`:""}
        </div>
        <div style="text-align:right">
          <div style="font-family:'Lora',serif;font-size:20px;font-weight:700">${pct}%</div>
          <div style="font-size:11px;color:var(--muted)">${done?"🎉 Tercapai!":"tersimpan"}</div>
        </div>
      </div>
      <div class="saving-progress"><div class="saving-fill${done?" done":""}" style="width:${pct}%"></div></div>
      <div class="saving-amounts">
        <span>${rp(saved)} terkumpul</span>
        <span>Target <strong>${rp(item.target)}</strong></span>
      </div>
      <div class="saving-contribs">
        <div class="contrib-box you">
          <div class="contrib-name you">${userName||"Kamu"}</div>
          <div class="contrib-val">${rp(myAmt)}</div>
        </div>
        <div class="contrib-box partner">
          <div class="contrib-name partner">${partnerName}</div>
          <div class="contrib-val">${rp(partnerAmt)}</div>
        </div>
      </div>
      <div class="saving-actions">
        <button class="btn-topup" onclick="openTopup('${item.id}')">+ Tabung</button>
        <button class="act-btn" onclick="editSaving('${item.id}')">✏️️</button>
        <button class="act-btn" onclick="deleteSaving('${item.id}')">🗑️</button>
      </div>`;
    list.appendChild(div);
  });
}

// ── UTILS ──
function rp(v) { if(!v) return "Rp 0"; return "Rp "+Number(v).toLocaleString("id-ID"); }
function fmtDate(d) { if(!d) return ""; try { return new Date(d+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short"}); } catch(e){return d;} }
function fmtDateFull(d) { if(!d) return ""; try { return new Date(d+"T00:00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"}); } catch(e){return d;} }
function fmtMonth(m) { if(!m) return ""; try { const [y,mo]=m.split("-"); return new Date(y,mo-1,1).toLocaleDateString("id-ID",{month:"long",year:"numeric"}); } catch(e){return m;} }

window.showToast = function(msg) {
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2200);
};

// expose for renderNeeds trigger
window.renderNeeds = renderNeeds;
window.renderExpenses = renderExpenses;
window.renderSavings = renderSavings;

  document.getElementById("setupScreen").style.display="none";
  document.getElementById("appRoot").style.display="block";

}

// ── WISHLIST ──
const WISH_PRIO = [
  {v:1, label:"⭐⭐⭐ Serius",  css:"p1"},
  {v:2, label:"⭐⭐ Mungkin",   css:"p2"},
  {v:3, label:"⭐ Iseng",       css:"p3"},
];

function renderWishlist() {
  const arr = Object.entries(wishlist).map(([id,v])=>({id,...v}))
    .sort((a,b) => (a.done===b.done ? (a.prio||3)-(b.prio||3) : a.done?1:-1));
  const pending = arr.filter(i=>!i.done);
  const totalEst = pending.reduce((s,i)=>s+(i.harga||0),0);

  const sumEl = document.getElementById("wishlistSummary");
  if(pending.length) {
    const rows = WISH_PRIO.map(p => {
      const items = pending.filter(i=>(i.prio||3)===p.v);
      const sub = items.reduce((s,i)=>s+(i.harga||0),0);
      if(!items.length) return "";
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:6px">
          <span class="prio-tag p${p.v}" style="font-size:9px;padding:2px 7px">${p.label}</span>
          <span style="font-size:11px;color:var(--muted)">${items.length} item</span>
        </div>
        <span style="font-size:13px;font-weight:700;color:var(--text)">${sub?formatRp(sub):"—"}</span>
      </div>`;
    }).join("");
    sumEl.innerHTML = `<div class="card" style="margin-bottom:10px;padding:10px 14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em">Estimasi Total</span>
        <span style="font-size:11px;color:var(--muted)">${arr.filter(i=>i.done).length}/${arr.length} selesai</span>
      </div>
      ${rows}
      ${totalEst?`<div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px">
        <span style="font-size:12px;font-weight:700;color:var(--muted)">Total semua</span>
        <span style="font-family:'Fraunces',serif;font-size:17px;font-weight:700;color:var(--rose)">${formatRp(totalEst)}</span>
      </div>`:""}
    </div>`;
  } else { sumEl.innerHTML = ""; }

  const el = document.getElementById("wishlistItems");
  if(!arr.length) {
    el.innerHTML = `<div class="empty-state"><div style="font-size:36px;margin-bottom:10px">⭐</div><div style="font-size:13px;color:var(--muted);line-height:1.6">Belum ada wishlist berdua<br>Tap + untuk tambah</div></div>`;
    return;
  }
  el.innerHTML = arr.map(item => {
    const p = WISH_PRIO.find(x=>x.v===(item.prio||3))||WISH_PRIO[2];
    return `<div class="item-card" style="${item.done?"opacity:0.5":""}">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <button onclick="toggleWishDone('${item.id}')"
          style="width:22px;height:22px;border-radius:6px;border:2px solid var(--border2);background:${item.done?"var(--rose)":"none"};color:${item.done?"#fff":"transparent"};cursor:pointer;flex-shrink:0;font-size:12px;margin-top:1px;display:flex;align-items:center;justify-content:center">
          ${item.done?"✓":""}
        </button>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:700;${item.done?"text-decoration:line-through;color:var(--muted)":""}">${item.nama}</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;margin:4px 0">
            <span class="prio-tag p${p.v}" style="font-size:9px;padding:2px 7px">${p.label}</span>
            ${item.kat?`<span style="font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid var(--border2);color:var(--muted)">${item.kat}</span>`:""}
          </div>
          ${item.harga?`<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px">${formatRp(item.harga)}</div>`:""}
          ${item.catatan?`<div style="font-size:11px;color:var(--muted);font-style:italic">"${item.catatan}"</div>`:""}
        </div>
        <div style="display:flex;gap:4px;flex-shrink:0">
          <button onclick="editWish('${item.id}')" style="background:none;border:none;cursor:pointer;font-size:14px;opacity:0.45">✏️</button>
          <button onclick="deleteWish('${item.id}')" style="background:none;border:none;cursor:pointer;font-size:14px;opacity:0.45">🗑️</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

window.toggleWishDone = function(id) {
  update(ref(db,"wishlist/"+id), {done:!(wishlist[id]?.done||false)});
};
window.editWish = function(id) {
  const w = wishlist[id]; if(!w) return;
  editWishId = id;
  document.getElementById("wFormTitle").textContent = "Edit Wishlist";
  document.getElementById("wNama").value = w.nama||"";
  document.getElementById("wPrio").value = w.prio||3;
  document.getElementById("wHarga").value = w.harga||"";
  document.getElementById("wKat").value = w.kat||"";
  document.getElementById("wCatatan").value = w.catatan||"";
  openForm("wishForm");
};
window.deleteWish = function(id) {
  remove(ref(db,"wishlist/"+id));
  showToast("Dihapus");
};
window.submitWish = function() {
  const nama = document.getElementById("wNama").value.trim();
  if(!nama) { showToast("Isi nama dulu ya"); return; }
  const data = {
    nama,
    prio: Number(document.getElementById("wPrio").value)||3,
    harga: Number(document.getElementById("wHarga").value)||0,
    kat: document.getElementById("wKat").value.trim(),
    catatan: document.getElementById("wCatatan").value.trim(),
    done: false, ts: Date.now()
  };
  if(editWishId) { update(ref(db,"wishlist/"+editWishId),data); showToast("Diupdate ✓"); }
  else { push(ref(db,"wishlist"),data); showToast("Ditambahkan ✓"); }
  editWishId = null;
  closeForm("wishForm");
};

window.toggleTheme = function() {
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  const next = isLight ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️ Light' : '🌙 Dark';
  localStorage.setItem('berdua_theme', next);
  // Re-render to pick up new CSS variable colors
  setTimeout(() => {
    if(typeof renderNeeds === 'function') renderNeeds();
    if(typeof renderExpenses === 'function' && currentPage === 'Expenses') renderExpenses();
  }, 50);
};
// Restore saved theme
(function() {
  const t = localStorage.getItem('berdua_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  setTimeout(() => {
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = t === 'dark' ? '☀️ Light' : '🌙 Dark';
  }, 0);
})();
</script>
