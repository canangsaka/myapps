<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {

}
.sub { font-size: 13px; color: #555; margin-bottom: 44px; text-align: center; }
.apps { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 360px; }
.app-card {
  display: block; text-decoration: none;

  border-radius: 20px; padding: 22px;
  transition: all 0.2s; position: relative; overflow: hidden;
}
.app-card::before {
  content: ''; position: absolute; inset: 0;
  border-radius: 20px; opacity: 0; transition: opacity 0.2s;
}
.app-card.personal::before { background: radial-gradient(circle at top left, rgba(212,168,83,0.1), transparent 70%); }
.app-card.berdua::before { background: radial-gradient(circle at top left, rgba(212,97,74,0.1), transparent 70%); }
.app-card:active { transform: scale(0.97); }
.app-card:active::before { opacity: 1; }
.app-icon { font-size: 36px; margin-bottom: 12px; display: block; }
.app-name { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 5px; letter-spacing: -0.02em; }
.app-card.personal .app-name { color: #d4a853; }
.app-card.berdua .app-name { color: #d4614a; }
.app-desc { font-size: 13px; color: #555; line-height: 1.55; margin-bottom: 14px; }
.app-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 99px; border: 1px solid; }
.app-card.personal .tag { color: #d4a853; border-color: rgba(212,168,83,0.25); background: rgba(212,168,83,0.07); }
.app-card.berdua .tag { color: #d4614a; border-color: rgba(212,97,74,0.25); background: rgba(212,97,74,0.07); }
.app-arrow { position: absolute; top: 22px; right: 20px; font-size: 18px; color: #333; transition: all 0.2s; }
.app-card:active .app-arrow { color: #555; transform: translateX(3px); }
.footer { margin-top: 44px; font-size: 11px; color: #2a2a2a; text-align: center; }
</style>
</head>
