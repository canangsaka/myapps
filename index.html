<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My Apps</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'DM Sans', sans-serif;
  background: #000;
  color: #f5f5f0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
}
.greeting {
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #444;
  margin-bottom: 8px;
}
h1 {
  font-family: 'Syne', sans-serif;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: #f5f5f0;
  margin-bottom: 6px;
  text-align: center;
}
.sub { font-size: 13px; color: #555; margin-bottom: 44px; text-align: center; }
.apps { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 360px; }
.app-card {
  display: block; text-decoration: none;
  background: #0d0d0d; border: 1px solid #1e1e1e;
  border-radius: 20px; padding: 22px;
  transition: all 0.2s; position: relative; overflow: hidden;
}
.app-card::before {
  content: ''; position: absolute; inset: 0;
  border-radius: 20px; opacity: 0; transition: opacity 0.2s;
}
.app-card.personal::before { background: radial-gradient(circle at top left, rgba(212,168,83,0.1), transparent 70%); }
.app-card.berdua::before { background: radial-gradient(circle at top left, rgba(212,97,74,0.1), transparent 70%); }
.app-card:active { transform: scale(0.97); }
.app-card:active::before { opacity: 1; }
.app-icon { font-size: 36px; margin-bottom: 12px; display: block; }
.app-name { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 5px; letter-spacing: -0.02em; }
.app-card.personal .app-name { color: #d4a853; }
.app-card.berdua .app-name { color: #d4614a; }
.app-desc { font-size: 13px; color: #555; line-height: 1.55; margin-bottom: 14px; }
.app-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 99px; border: 1px solid; }
.app-card.personal .tag { color: #d4a853; border-color: rgba(212,168,83,0.25); background: rgba(212,168,83,0.07); }
.app-card.berdua .tag { color: #d4614a; border-color: rgba(212,97,74,0.25); background: rgba(212,97,74,0.07); }
.app-arrow { position: absolute; top: 22px; right: 20px; font-size: 18px; color: #333; transition: all 0.2s; }
.app-card:active .app-arrow { color: #555; transform: translateX(3px); }
.footer { margin-top: 44px; font-size: 11px; color: #2a2a2a; text-align: center; }
</style>
</head>
<body>

<div class="greeting">Selamat datang</div>
<h1>My Apps ✦</h1>
<p class="sub">Pilih aplikasi yang mau dibuka</p>

<div class="apps">

  <a class="app-card personal" href="./budget-personal.html">
    <span class="app-arrow">→</span>
    <span class="app-icon">📊</span>
    <div class="app-name">Keuangan Pribadi</div>
    <div class="app-desc">Budget, tabungan, dan tracker pengeluaran harianmu.</div>
    <div class="app-tags">
      <span class="tag">Dashboard</span>
      <span class="tag">Transaksi</span>
      <span class="tag">Budget Plan</span>
      <span class="tag">Tabungan</span>
    </div>
  </a>

  <a class="app-card berdua" href="./berdua-app.html">
    <span class="app-arrow">→</span>
    <span class="app-icon">💕</span>
    <div class="app-name">Berdua</div>
    <div class="app-desc">List kebutuhan, keuangan, dan tabungan bareng Yaya.</div>
    <div class="app-tags">
      <span class="tag">List Kebutuhan</span>
      <span class="tag">Pengeluaran</span>
      <span class="tag">Tabungan</span>
    </div>
  </a>

</div>

<div class="footer">canangsaka.github.io/myapps</div>

</body>
</html>
