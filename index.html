<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'DM Sans',sans-serif;
  background:#000;
  color:#f0ede8;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  width:100%;
  max-width:320px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.eyebrow{
  font-size:11px;
  font-weight:700;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:#2a2a2a;
  margin-bottom:10px;
}
h1{
  font-family:'Fraunces',serif;
  font-size:36px;
  font-weight:800;
  letter-spacing:-0.03em;
  color:#f0ede8;
  margin-bottom:5px;
  text-align:center;
  line-height:1;
}
.sub{
  font-size:13px;
  color:#3a3a3a;
  margin-bottom:40px;
  text-align:center;
}
.apps{
  display:flex;
  flex-direction:column;
  gap:12px;
  width:100%;
}
.app-card{
  display:block;
  text-decoration:none;
  background:#0a0a0a;
  border:1px solid #1a1a1a;
  border-radius:18px;
  padding:20px;
  transition:all 0.18s;
  position:relative;
  overflow:hidden;
}
.app-card:active{transform:scale(0.97);}
.glow-gold::after{
  content:'';
  position:absolute;
  top:-40px;left:-40px;
  width:140px;height:140px;
  background:radial-gradient(circle,rgba(212,168,83,0.12),transparent 70%);
  pointer-events:none;
}
.glow-rose::after{
  content:'';
  position:absolute;
  top:-40px;left:-40px;
  width:140px;height:140px;
  background:radial-gradient(circle,rgba(200,90,66,0.12),transparent 70%);
  pointer-events:none;
}
.card-icon{font-size:32px;margin-bottom:10px;display:block;}
.card-name{
  font-family:'Fraunces',serif;
  font-size:19px;
  font-weight:700;
  margin-bottom:4px;
  letter-spacing:-0.01em;
}
.gold .card-name{color:#d4a853;}
.rose .card-name{color:#c85a42;}
.card-desc{
  font-size:12px;
  color:#3a3a3a;
  line-height:1.5;
  margin-bottom:14px;
}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;}
.tag{
  font-size:10px;
  font-weight:700;
  padding:3px 9px;
  border-radius:99px;
  border:1px solid;
  letter-spacing:0.02em;
}
.gold .tag{color:#d4a853;border-color:rgba(212,168,83,0.25);background:rgba(212,168,83,0.07);}
.rose .tag{color:#c85a42;border-color:rgba(200,90,66,0.25);background:rgba(200,90,66,0.07);}
.arr{
  position:absolute;
  top:18px;right:18px;
  font-size:16px;
  color:#222;
  transition:transform 0.18s,color 0.18s;
}
.app-card:active .arr{color:#444;transform:translateX(3px);}
.footer{
  margin-top:36px;
  font-size:10px;
  color:#1e1e1e;
  letter-spacing:0.06em;
  text-align:center;
}
</style>
</head>

      <div class="card-tags">

        <span class="tag">Budget Plan</span>
        <span class="tag">Tabungan</span>
      </div>

      <div class="card-tags">
